let activeTab = 'senior';

const FS = [['', 'Tous'], ['M', 'Hommes'], ['F', 'Femmes']];

function drawFilters() {
  const mk = (id, opts, cur, key) => {
    const g = document.getElementById(id), lbl = g.querySelector('.fgroup-lbl').outerHTML;
    g.innerHTML = lbl + opts.map(([v, t]) => `<button type="button" class="fpill" aria-pressed="${v === cur}" onclick="setFilter('${key}','${v}')">${t}</button>`).join('');
  };
  mk('fg-classif', FC, fClassif, 'c');
  mk('fg-sexe', FS, fSexe, 's');
  document.getElementById('fg-sexe').hidden = activeTab !== 'senior';
  updateToggle();
}
function updateToggle() {
  const t = document.getElementById('filter-toggle'), open = t.getAttribute('aria-expanded') === 'true';
  const n = (fClassif ? 1 : 0) + (fSexe && activeTab === 'senior' ? 1 : 0) + (document.getElementById('search-input').value.trim() ? 1 : 0);
  t.textContent = (open ? 'Fermer la recherche' : 'Rechercher ou filtrer') + (n ? ' (' + n + ')' : '');
}
function setFilter(k, v) { if (k === 'c') fClassif = v; else fSexe = v; drawFilters(); renderTable(); }
function toggleFilters() {
  const t = document.getElementById('filter-toggle'), p = document.getElementById('filter-panel'), open = t.getAttribute('aria-expanded') !== 'true';
  t.setAttribute('aria-expanded', open); p.hidden = !open; drawFilters();
  if (open) document.getElementById('search-input').focus();
}
function clearSearch() { const i = document.getElementById('search-input'); i.value = ''; i.focus(); renderTable(); }

function toggleAll() {

}
function setTab(tab, btn) {
  activeTab = tab;

  btn.classList.add('active');
  { const t = document.getElementById('all-toggle'); t.setAttribute('aria-expanded', 'false'); document.getElementById('cat-tabs').hidden = true; t.textContent = 'Tous les classements ▾'; }

  if (c === 'Promotion') return 'badge-Promotion';
  return 'badge-Non-Class';

  if (rank === 1) return '<span class="rank-cell top1">🥇</span>';
  if (rank === 2) return '<span class="rank-cell top2">🥈</span>';
  if (rank === 3) return '<span class="rank-cell top3">🥉</span>';
  return `<span class="rank-cell">${rank}</span>`;
}

function renderTable() {
  const container = document.getElementById('table-container');
  const countEl = document.getElementById('result-count');
  const q = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
  const classifFilter = fClassif, sexeFilter = fSexe;
  const cb = document.getElementById('clear-btn'); if (cb) cb.hidden = !q;
  updateToggle();

  if (activeTab === 'clubs') {
    let rows = DATA.clubs;
    const maxPts = rows[0].pts;
    let html = '<table><thead><tr><th style="width:50px">#</th><th>Club</th><th class="right" style="width:120px">Points</th></tr></thead><tbody>';
    rows.forEach((r, i) => {
      const pct = Math.round((r.pts / maxPts) * 100);
      html += `<tr>
        <td>${rankIcon(i+1)}</td>
        <td>
          <div style="font-weight:600;margin-bottom:4px">${r.club}</div>
          <div class="club-rank-bar">
            <div class="bar-fill" style="width:${pct}%"></div>
          </div>
        </td>
        <td class="right">${r.pts} pts</td>
      </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
    countEl.textContent = rows.length + ' clubs';
    return;
  }

  let rows = DATA[activeTab] || [];

  // Filtres
  if (q) {
    rows = rows.filter(r => {
      const s = ((r.nom||'') + ' ' + (r.prenom||'') + ' ' + (r.club||'')).toLowerCase();
      return s.includes(q);
    });
  }
  if (classifFilter) {
    rows = rows.filter(r => (r.classif || '') === classifFilter);
  }
  if (sexeFilter && activeTab === 'senior') {
    rows = rows.filter(r => r.sexe === sexeFilter);
  }

  countEl.textContent = rows.length + ' joueur' + (rows.length > 1 ? 's' : '') + ' affiché' + (rows.length > 1 ? 's' : '');

  if (rows.length === 0) {
    container.innerHTML = '<div class="no-result">Aucun résultat pour cette recherche.</div>';
    return;
  }

  const hasCategory = activeTab === 'jeunes';
  const hasSexe = activeTab === 'senior';
  const hasConcours = activeTab === 'senior' || activeTab === 'jeunes';

  let html = '<table><thead><tr>';
  html += '<th style="width:50px;text-align:center">#</th>';
  html += '<th>Joueur</th>';
  html += '<th class="hide-sm">Club</th>';
  if (hasCategory) html += '<th class="hide-sm">Catégorie</th>';
  html += '<th class="hide-sm">Classification</th>';
  if (hasConcours) html += '<th class="right hide-sm">Concours</th>';
  html += '<th class="right">Points</th>';
  html += '</tr></thead><tbody>';

  rows.forEach((r, i) => {
    const badgeClass = getBadgeClass(r.classif);
    const classifLabel = r.classif === 'Non Classé' ? 'Non Classé' : r.classif;
    html += `<tr>
      <td style="text-align:center">${rankIcon(i+1)}</td>
      <td>
        <div style="font-weight:600">${r.nom} <span style="font-weight:400;color:#555">${r.prenom}</span></div>
        <div class="sub-mobile">${r.club}${hasCategory && r.cat ? ' · ' + r.cat : ''} <span class="badge ${badgeClass}" style="margin-left:4px">${classifLabel}</span></div>
        ${hasSexe ? `<div style="font-size:.72rem;margin-top:2px" class="sexe-${r.sexe}">${r.sexe === 'M' ? '♂ Homme' : '♀ Femme'}</div>` : ''}
      </td>
      <td class="hide-sm" style="color:#666;font-size:.85rem">${r.club}</td>
      ${hasCategory ? `<td class="hide-sm"><span style="font-size:.82rem;color:#555">${r.cat||''}</span></td>` : ''}
      <td class="hide-sm"><span class="badge ${badgeClass}">${classifLabel}</span></td>
      ${hasConcours ? `<td class="right hide-sm" style="color:#888;font-weight:400">${r.concours ?? '—'}</td>` : ''}
      <td class="right">${r.pts} pts</td>
    </tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

// Init
document.getElementById('navbar').style.boxShadow = 'none';
window.addEventListener('scroll', () => {
  document.getElementById('navbar').style.boxShadow = window.scrollY > 30 ? '0 4px 30px rgba(0,0,0,.4)' : 'none';
});

const reveals = document.querySelectorAll('.reveal');
const obs = new IntersectionObserver((entries) => {
  entries.forEach((e, i) => { if (e.isIntersecting) { setTimeout(() => e.target.classList.add('visible'), i * 60); obs.unobserve(e.target); } });
}, { threshold: 0.08 });
reveals.forEach(r => obs.observe(r));

// Afficher le classement senior par défaut
drawFilters();
renderTable();
</script>
