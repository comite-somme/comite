<style>
  .cdc-hero { background: var(--bleu); border-radius: 10px; border-left: 5px solid var(--or); padding: 1.2rem 1.3rem; display: flex; flex-direction: column; gap: 0.9rem; margin-bottom: 1.8rem; }
  .cdc-hero p { color: rgba(255,255,255,0.8); font-size: 0.9rem; margin: 0; }
  .cdc-hero strong { color: #fff; display: block; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 1.25rem; margin-bottom: 0.15rem; }
  .cdc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 44px; padding: 0.7rem 1.3rem; border-radius: 6px; background: var(--or); color: var(--bleu); font-weight: 700; font-size: 0.88rem; text-decoration: none; transition: background 0.2s; align-self: flex-start; }
  .cdc-btn:hover { background: var(--or-light); }
  .cdc-h2 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 1.6rem; color: var(--bleu); margin: 2.2rem 0 1rem; }
  .cdc-h2 em { color: var(--or); font-style: italic; }
  .cdc-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
  .cdc-card { background: #fff; border: 1px solid var(--gris); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(10,35,66,.06), 0 4px 14px rgba(10,35,66,.05); display: flex; flex-direction: column; }
  .cdc-card header { background: var(--bleu); padding: 1rem 1.2rem; border-bottom: 3px solid var(--or); }
  .cdc-card h3 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; letter-spacing: 1.5px; font-size: 1.5rem; color: #fff; margin: 0 0 0.5rem; line-height: 1.1; }
  .cdc-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .cdc-tags span { background: rgba(201,168,76,0.18); color: var(--or-light, #e2c87a); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; padding: 2px 9px; border-radius: 12px; }
  .cdc-body { padding: 1rem 1.2rem 1.2rem; display: flex; flex-direction: column; gap: 0.55rem; flex: 1; }
  .cdc-link { display: flex; align-items: center; gap: 0.7rem; min-height: 48px; padding: 0.55rem 0.8rem; border: 1.5px solid var(--gris); border-radius: 8px; text-decoration: none; color: var(--bleu); font-weight: 600; font-size: 0.9rem; background: #fff; transition: border-color 0.2s, background 0.2s, transform 0.1s; }
  .cdc-link:hover { border-color: var(--or); background: #fffdf6; }
  .cdc-link:focus-visible, .cdc-btn:focus-visible, .cdc-tab:focus-visible, .cdc-act:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  .cdc-link svg { flex-shrink: 0; width: 30px; height: 30px; padding: 6px; border-radius: 50%; background: rgba(201,168,76,0.18); stroke: #9a7a1f; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cdc-l-t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .cdc-l-d { font-size: 0.75rem; font-weight: 600; color: #667085; white-space: nowrap; }
  .cdc-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1.2rem; }
  .cdc-tab { flex: 1 1 auto; justify-content: center; min-height: 46px; display: inline-flex; align-items: center; border: 1.5px solid var(--gris); background: #fff; color: #555; font: 700 0.88rem 'DM Sans', sans-serif; padding: 0.4rem 0.9rem; border-radius: 25px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .cdc-tab:hover { border-color: var(--or); color: var(--bleu); }
  .cdc-tab[aria-selected="true"] { background: var(--bleu); color: var(--or); border-color: var(--bleu); }
  .cdc-panel { background: #fff; border: 1px solid var(--gris); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(10,35,66,.06), 0 4px 14px rgba(10,35,66,.05); }
  .cdc-panel header { background: var(--bleu); padding: 1rem 1.2rem; border-bottom: 3px solid var(--or); }
  .cdc-panel h3 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; letter-spacing: 1.5px; font-size: 1.6rem; color: #fff; margin: 0 0 0.5rem; line-height: 1.1; }
  .cdc-panel .cdc-body { padding: 1rem 1.2rem 1.3rem; gap: 0.9rem; }
  .cdc-yr { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1.5px; font-size: 1.25rem; color: var(--bleu); border-bottom: 2px solid var(--or); padding-bottom: 0.2rem; margin-top: 0.4rem; }
  .cdc-doc { border: 1.5px solid var(--gris); border-radius: 10px; padding: 0.8rem 1rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .cdc-doc b { color: var(--bleu); font-size: 1rem; overflow-wrap: anywhere; }
  .cdc-doc small { color: #667085; font-size: 0.82rem; }
  .cdc-acts { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.3rem; }
  .cdc-act { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0.5rem 1.1rem; border-radius: 8px; border: 0; background: var(--or); color: var(--bleu); font: 700 0.85rem 'DM Sans', sans-serif; text-decoration: none; cursor: pointer; transition: background 0.2s; }
  .cdc-act:hover { background: var(--or-light); }
  .cdc-act.alt { background: #fff; border: 1.5px solid var(--or); }
  .cdc-act:disabled { opacity: .6; cursor: wait; }
  .cdc-hint { display: flex; align-items: center; gap: 0.5rem; margin: 0.6rem 0 0; color: rgba(255,255,255,0.88); font-size: 0.85rem; }
  .cdc-hint svg { flex-shrink: 0; width: 18px; height: 18px; stroke: var(--or-light, #e2c87a); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cdc-btn.off { opacity: .55; pointer-events: none; }
  .cdc-empty { text-align: center; color: #667085; padding: 2rem 1rem; border: 1px dashed var(--gris); border-radius: 10px; }

  /* ── Championnats : une ligne par championnat, deux boutons Tirage / Résultats ── */
  .cdc-champs { display: grid; grid-template-columns: 1fr; gap: 0.8rem; }
  .cdc-champ { display: flex; flex-direction: column; gap: 0.6rem; border: 1.5px solid var(--gris); border-radius: 10px; padding: 0.8rem 1rem; background: #fff; }
  .cdc-champ-n { font-family: 'Bebas Neue', sans-serif; font-weight: 400; letter-spacing: 1.5px; font-size: 1.35rem; color: var(--bleu); line-height: 1.1; }
  .cdc-champ-b { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .cdc-pill { flex: 1 1 130px; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: 46px; padding: 0.45rem 1rem; border-radius: 26px; border: 2px solid var(--or); background: #fffdf6; color: var(--bleu); font: 700 0.9rem 'DM Sans', sans-serif; letter-spacing: 0.3px; text-decoration: none; cursor: pointer; transition: background 0.2s, transform 0.1s, box-shadow 0.2s; }
  .cdc-pill.res { background: var(--or); }
  .cdc-pill:hover { background: var(--or); box-shadow: 0 3px 10px rgba(201,168,76,.4); transform: translateY(-1px); }
  .cdc-pill.res:hover { background: var(--or-light); }
  .cdc-pill:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }
  .cdc-pill.off { border-color: var(--gris); background: #f4f5f7; color: #98a2b3; cursor: default; pointer-events: none; box-shadow: none; transform: none; }
  .cdc-pill.off::after { content: 'bientôt'; margin-left: 0.3rem; font-size: 0.66rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

  @media (min-width: 768px) {
    .cdc-hero { flex-direction: row; align-items: center; justify-content: space-between; padding: 1.5rem 2rem; }
    .cdc-grid { grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .cdc-champs { grid-template-columns: 1fr 1fr; }
    }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
  window.addEventListener('scroll', () => { document.getElementById('navbar').style.boxShadow = window.scrollY > 30 ? '0 4px 30px rgba(0,0,0,0.4)' : 'none'; });

  /* ══════════ CONTENU DE LA PAGE ══════════
     Chaque championnat a DEUX PDF : le tirage et les résultats.
     Dépose les fichiers à la racine du site (voir DIR plus bas) avec ces noms :
         <code>-tirage.pdf      (ex. cdc-d1-tirage.pdf)
         <code>-resultats.pdf   (ex. cdc-d1-resultats.pdf)
     Un bouton est actif uniquement si son fichier est listé dans DISPO (plus bas) ; sinon il reste grisé « bientôt ».
     Pour remplacer un PDF : même nom de fichier. */
  /* Dossier des PDF : '' = à la racine du dépôt (à côté de cdc.html) ; mets 'cdc/' si tu les ranges dans un dossier cdc */
  const DIR = '';
  const GENERAL = { titre: 'Calendrier général 2026', texte: 'CNC · CRC · CDC — toutes les journées de la saison', lien: { t: 'Télécharger (PDF)', u: DIR + 'calendrier-general.pdf' } };

  /* t = nom affiché · f = code du fichier (sans extension) */
  const P = (t, f) => ({ t, tirage: DIR + f + '-tirage.pdf', res: DIR + f + '-resultats.pdf' });
  const ONGLETS = [
    { k: 'openfem',   titre: 'Open Féminin', sous: [P('CNCF 1A', 'cncf-1a'), P('CNCF 2A', 'cncf-2a'), P('CRCF 1A', 'crcf-1a'), P('CRCF 2A', 'crcf-2a'), P('CDCF', 'cdcf')] },
    { k: 'open',      titre: 'Open', sous: [P('CNC 1A', 'cnc-1a'), P('CRC 1A', 'crc-1a'), P('CRC 2A', 'crc-2a'), P('CDC D1', 'cdc-d1'), P('CDC D2', 'cdc-d2'), P('CDC D3', 'cdc-d3'), P('CDC D4', 'cdc-d4')] },
    { k: 'veterans',  titre: 'Vétérans', sous: [P('CRC', 'crc-veterans'), P('CDC Vétéran', 'cdc-veteran')] },
    { k: 'provencal', titre: 'Jeu Provençal', sous: [P('CRC', 'crc-jeu-provencal'), P('CDC Jeu Provençal', 'cdc-jeu-provencal')] },
    { k: 'jeunes',    titre: 'CDC Jeunes', sous: [P('CDC Jeunes', 'cdc-jeunes')] }
  ];

  const F = 'https://comite-de-la-somme-3.e-monsite.com/medias/files/';
  const REGLEMENTS = [
    { t: 'Règlement CNC FFPJP', u: F + 'reglement-cnc-2024.pdf' },
    { t: 'Règlement CNC Vétérans FFPJP', u: F + 'reglement-cncv-2024.pdf' },
    { t: 'Règlement CNC Jeu Provençal FFPJP', u: F + 'reglement-cncjp-2024.pdf' },
    { t: 'Règlement intérieur CDC CD80', u: F + 'reglement-interieur-cdc-cd80-maj-05092025.pdf', d: 'FFPJP' }
  ];

  /* ══════════ AFFICHAGE ══════════ */
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safe = u => /^(https?:\/\/|[\w\-./]+\.pdf$)/i.test(u || '') ? u : '#';
  const FILE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>';
  const HAND = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5m0 0V8.5a1.5 1.5 0 0 1 3 0V11m0 0V10a1.5 1.5 0 0 1 3 0v5a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.7-2.3L4 15.5a1.6 1.6 0 0 1 2.4-2L9 16"/></svg>';
  const link = l => `<a class="cdc-link" href="${esc(safe(l.u))}" target="_blank" rel="noopener">${FILE}<span class="cdc-l-t">${esc(l.t)}</span>${l.d ? `<span class="cdc-l-d">${esc(l.d)}</span>` : ''}</a>`;

  let active = (ONGLETS.find(o => o.k === location.hash.slice(1)) || ONGLETS[0]).k;
  /* PDF réellement déposés (voir DIR) — AJOUTE ici le nom de chaque nouveau fichier (tirage ou résultats) pour activer son bouton */
  const DISPO = new Set([
    'cdc-d1-resultats.pdf', 'cdc-d2-resultats.pdf', 'cdc-d3-resultats.pdf', 'cdc-d4-resultats.pdf',
    'cdcf-resultats.pdf', 'cdc-veteran-resultats.pdf', 'cdc-jeu-provencal-resultats.pdf'
  ].map(f => DIR + f));
  const missing = { has: u => !DISPO.has(u) }; /* grisé = pas dans la liste ci-dessus */

  /* Un bouton (Tirage ou Résultats) : lien actif si le PDF existe, sinon pastille grisée */
  const pill = (label, u, name, cls) => missing.has(u)
    ? `<span class="cdc-pill off" aria-disabled="true">${esc(label)}</span>`
    : `<a class="cdc-pill ${cls}" href="${esc(safe(u))}" target="_blank" rel="noopener" aria-label="${esc(label)} ${esc(name)} — ouvrir le PDF">${esc(label)}</a>`;

  function panel() {
    const o = ONGLETS.find(x => x.k === active);
    const rows = o.sous.map(p => `<div class="cdc-champ"><div class="cdc-champ-n">${esc(p.t)}</div><div class="cdc-champ-b">${pill('Tirage', p.tirage, p.t, 'tir')}${pill('Résultats', p.res, p.t, 'res')}</div></div>`).join('');
    $('#cdcPanel').innerHTML = `<header><h3>${esc(o.titre)}</h3><p class="cdc-hint">${HAND}<span><strong>Clique sur « Tirage » ou « Résultats »</strong> pour ouvrir le PDF de chaque championnat.</span></p></header><div class="cdc-body"><div class="cdc-champs">${rows}</div></div>`;
    $('#cdcPanel').setAttribute('aria-labelledby', 'tab-' + o.k);
    document.querySelectorAll('.cdc-tab').forEach(b => { const on = b.dataset.k === o.k; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
  }

  document.getElementById('cdcRoot').innerHTML = `
    <div class="cdc-hero"><div><strong>${esc(GENERAL.titre)}</strong><p>${esc(GENERAL.texte)}</p></div>
      <a class="cdc-btn" id="cdcGen" href="${esc(safe(GENERAL.lien.u))}" target="_blank" rel="noopener">${FILE.replace('<svg ', '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" ')}${esc(GENERAL.lien.t)}</a></div>
    <h2 class="cdc-h2">Les <em>championnats</em></h2>
    <div class="cdc-tabs" role="tablist" aria-label="Championnats">${ONGLETS.map(o => `<button type="button" class="cdc-tab" role="tab" id="tab-${o.k}" data-k="${o.k}" aria-controls="cdcPanel">${esc(o.titre)}</button>`).join('')}</div>
    <div class="cdc-panel" id="cdcPanel" role="tabpanel"></div>
    <h2 class="cdc-h2">Les <em>règlements</em></h2>
    <div class="cdc-grid">${REGLEMENTS.map(link).join('')}</div>`;

  $('.cdc-tabs').addEventListener('click', e => { const b = e.target.closest('.cdc-tab'); if (!b) return; active = b.dataset.k; history.replaceState(null, '', '#' + active); panel(); });
  $('.cdc-tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = ONGLETS.findIndex(o => o.k === active), n = (i + (e.key === 'ArrowRight' ? 1 : -1) + ONGLETS.length) % ONGLETS.length;
    active = ONGLETS[n].k; panel(); $('#tab-' + active).focus();
  });
  panel();

  if (missing.has(GENERAL.lien.u)) $('#cdcGen').classList.add('off');
</script>
<script src="nav.js"></script>

<script src="pwa.js" defer></script>
