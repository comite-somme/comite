<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="logocomite.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a2342">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-admin.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CD80 Admin">
<title>Administration — Comité de la Somme</title>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<link rel="stylesheet" href="fonts-admin.css">
<style>
:root{
  --bleu:#0a2342;--bleu2:#0d3060;--or:#c9a84c;--orl:#e2c87a;--fond:#f5f4f0;--gris:#dfe3e8;
  --txt:#1a1f2e;--mut:#667085;--ko:#b3261e;--ok:#18794e;--r:10px;
  --sh:0 1px 2px rgba(10,35,66,.06),0 4px 14px rgba(10,35,66,.06);
  --sh2:0 2px 4px rgba(10,35,66,.08),0 12px 28px rgba(10,35,66,.12)
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--fond);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
a{color:var(--bleu)}
.ic{flex-shrink:0}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1.5px solid transparent;border-radius:8px;padding:.6rem 1.1rem;font-weight:700;font-size:.92rem;min-height:44px;letter-spacing:.2px;text-decoration:none;transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn:disabled,.btn.load{opacity:.65;pointer-events:none}
.b-or{background:var(--or);color:var(--bleu)}.b-or:hover{background:var(--orl)}
.b-bl{background:var(--bleu);color:#fff}.b-bl:hover{background:var(--bleu2)}
.b-ln{background:#fff;border-color:var(--gris);color:var(--bleu)}.b-ln:hover{border-color:var(--or);background:#fffdf6}
.b-ko{background:#fff;border-color:#efc4c0;color:var(--ko)}.b-ko:hover{background:#fdeceb;border-color:#e6a8a2}
.b-ko-s{background:var(--ko);color:#fff}.b-ko-s:hover{background:#962019}
.b-ic{padding:.5rem;min-width:44px}

/* Champs */
input,select,textarea{width:100%;font:inherit;font-size:1rem;color:var(--txt);padding:.65rem .85rem;border:1.5px solid var(--gris);border-radius:8px;background:#fff;min-height:44px;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical}
input:hover,select:hover,textarea:hover{border-color:#c4cad3}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(201,168,76,.28)}
button:focus-visible,a:focus-visible{outline:3px solid var(--or);outline-offset:2px;border-radius:6px}
label{display:block;font-size:.78rem;font-weight:700;color:var(--bleu);margin:0 0 .35rem;letter-spacing:.2px}
label .rq{color:var(--ko);margin-left:2px}
.f{margin-bottom:1rem}

/* Connexion */
#login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,var(--bleu),var(--bleu2) 55%,#1a5276)}
.box{background:#fff;border-radius:16px;padding:2.2rem 2rem 2rem;width:100%;max-width:400px;text-align:center;border-top:4px solid var(--or);box-shadow:var(--sh2)}
.box img{width:84px;height:auto;margin-bottom:.6rem}
.box h1{font-family:'Bebas Neue';font-weight:400;letter-spacing:2px;font-size:2rem;margin:0;color:var(--bleu);line-height:1.1}
.box .sub{color:var(--mut);margin:.2rem 0 1.5rem;font-size:.9rem}
.box .f{text-align:left}
.pwrap{position:relative}.pwrap input{padding-right:3rem}
.pwrap button{position:absolute;right:2px;top:2px;bottom:2px;width:44px;background:none;border:0;color:var(--mut);border-radius:6px;display:grid;place-items:center}
.pwrap button:hover{color:var(--bleu)}
.lerr{background:#fdeceb;color:var(--ko);border:1px solid #efc4c0;border-radius:8px;padding:.6rem .8rem;font-size:.88rem;margin-bottom:1rem;text-align:left}
.box .lnk{margin:1.1rem 0 0;font-size:.88rem}

/* Bandeau */
header{background:var(--bleu);border-bottom:3px solid var(--or);color:#fff;padding:.6rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0}
.brand img{height:42px;width:auto}
.brand b{font-family:'Bebas Neue';font-weight:400;font-size:1.4rem;letter-spacing:1.5px;display:block;line-height:1}
.brand small{color:var(--orl);font-size:.7rem;letter-spacing:1.2px}
.hr{display:flex;gap:.5rem;align-items:center}
.hr a{color:var(--orl);font-weight:700;font-size:.85rem;text-decoration:none;padding:.5rem .6rem;display:inline-flex;align-items:center;gap:.35rem;border-radius:6px}
.hr a:hover{background:rgba(255,255,255,.08)}
.hr .btn{min-height:38px;padding:.3rem .9rem;font-size:.85rem}

/* Menu hamburger */
header{position:sticky;top:0;z-index:30}
.lft{display:flex;align-items:center;gap:.75rem;min-width:0}
#burger{display:inline-flex;align-items:center;gap:.5rem;position:relative;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;min-height:44px;padding:.4rem .8rem;font-weight:700;font-size:.88rem}
#burger:hover{background:rgba(255,255,255,.14);border-color:var(--or)}
#curname{color:var(--orl);max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scrim{position:fixed;inset:0;background:rgba(10,35,66,.55);z-index:40}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:#fff;z-index:50;display:flex;flex-direction:column;border-right:4px solid var(--or);box-shadow:var(--sh2);transform:translateX(-100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
#drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
.dh{display:flex;justify-content:space-between;align-items:center;padding:.6rem .6rem .6rem 1rem;background:var(--bleu);color:#fff}
.dh b{font-family:'Bebas Neue';font-weight:400;font-size:1.5rem;letter-spacing:2px}
.dh button{background:none;border:0;color:#fff;min-width:44px;min-height:44px;border-radius:8px;display:grid;place-items:center}
.dh button:hover{background:rgba(255,255,255,.12)}
#tabs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:.4rem .6rem 1.2rem}
.dg{font-size:.7rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:1rem .6rem .3rem}
#tabs button{width:100%;display:flex;align-items:center;gap:.8rem;min-height:46px;padding:.5rem .7rem;background:none;border:0;border-left:3px solid transparent;border-radius:8px;color:var(--txt);font-weight:700;font-size:.95rem;text-align:left}
#tabs button:hover{background:#faf8f2;color:var(--bleu)}
#tabs button.on{background:#fbf7e9;color:var(--bleu);border-left-color:var(--or)}
.nb{margin-left:auto;background:var(--ko);color:#fff;border-radius:99px;font-size:.7rem;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
#burger .nb.dot{position:absolute;top:-4px;right:-4px;min-width:12px;height:12px;padding:0;border:2px solid var(--bleu)}
main{max-width:960px;margin:0 auto;padding:1.6rem 1rem 4rem}

/* Titres de page */
.ph{margin-bottom:1.3rem}
.ph h1{font-family:'Bebas Neue';font-weight:400;letter-spacing:2px;font-size:2.2rem;color:var(--bleu);margin:0;line-height:1.1;border-bottom:3px solid var(--or);display:inline-block;padding-bottom:.15rem}
.ph p{color:var(--mut);margin:.55rem 0 0;max-width:62ch}

/* Accueil */
.hello{background:linear-gradient(160deg,var(--bleu),var(--bleu2));color:#fff;border-radius:12px;padding:1.5rem;margin-bottom:1.2rem;border-left:5px solid var(--or);box-shadow:var(--sh)}
.hello h1{font-family:'DM Serif Display';font-weight:400;font-size:1.6rem;margin:0 0 .3rem}
.hello p{margin:0;color:rgba(255,255,255,.78)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.tile{background:#fff;border:1px solid var(--gris);border-radius:12px;padding:1.1rem 1.2rem;display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;align-items:center;text-align:left;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--or)}
.tile .i{grid-row:1/4;width:46px;height:46px;border-radius:10px;background:#fbf3d9;color:var(--bleu);display:grid;place-items:center}
.tile .n{font-family:'Bebas Neue';font-size:2.3rem;color:var(--bleu);line-height:1}
.tile b{color:var(--bleu)}
.tile small{color:var(--mut)}
.sech{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:1.8rem 0 .7rem}
.sech h2{font-family:'DM Serif Display';font-weight:400;font-size:1.3rem;color:var(--bleu);margin:0}
.lnkb{background:none;border:0;color:var(--bleu);font-weight:700;font-size:.88rem;padding:.4rem .2rem;text-decoration:underline;text-underline-offset:3px}
.lnkb:hover{color:var(--or)}

/* Listes */
.bar{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.srch{position:relative;flex:2;min-width:200px}
.srch .ic{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.srch input{padding-left:2.5rem}
.bar select{flex:1;min-width:150px;width:auto}
.gh{font-family:'Bebas Neue';letter-spacing:2px;font-size:1.3rem;color:var(--bleu);margin:1.5rem 0 .6rem;padding-bottom:.2rem;border-bottom:2px solid var(--or);display:inline-block}
.gh span{color:var(--mut);font-size:1rem;letter-spacing:1px}
.row{background:#fff;border:1px solid var(--gris);border-radius:var(--r);padding:.7rem .9rem;margin-bottom:.5rem;display:flex;gap:.9rem;align-items:center;box-shadow:0 1px 2px rgba(10,35,66,.04);transition:border-color .15s,box-shadow .15s}
.row:hover{border-color:#cfd5dd;box-shadow:var(--sh)}
.row.past{opacity:.6}
.row .m{flex:1;min-width:0}
.row strong{display:block;color:var(--bleu);overflow-wrap:anywhere}
.row small{color:var(--mut);overflow-wrap:anywhere;display:block}
.dt{background:var(--bleu);color:var(--or);border-radius:8px;width:54px;flex-shrink:0;text-align:center;padding:.35rem 0;font-family:'Bebas Neue';line-height:1}
.dt b{display:block;font-size:1.6rem;font-weight:400;color:var(--or)}
.dt span{font-size:.8rem;letter-spacing:1px;color:#fff}
.bd.jn-h{min-width:62px;font-size:.95rem}
.jn-who{color:var(--bleu);text-decoration:underline;text-decoration-color:var(--or);text-underline-offset:3px}
.jn{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 9px;border-radius:10px;letter-spacing:.2px;color:#fff;background:var(--bleu2);vertical-align:1px}
.jd{margin:.35rem 0 0;padding:0;list-style:none;font-size:.85rem;color:var(--txt,#1a1a2e);display:grid;gap:.2rem}.jd li{padding:.2rem .55rem;background:#f6f4ee;border-left:3px solid var(--or);border-radius:4px;overflow-wrap:anywhere}.jd li.more{background:none;border:0;color:var(--mut);font-style:italic;padding-left:0}
.dtabs{margin-bottom:1rem}.dline .dx{grid-column:1/-1;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}.dline .dx input{width:6.5rem}.dpills .dq{border:0;cursor:pointer;font-family:inherit}.dneed{display:block;color:var(--mut);font-size:.82rem;margin:.3rem 0 0}.dneed.ok{color:#067647}.dhint{display:block;color:var(--bleu);font-weight:600;font-size:.82rem;margin:.25rem 0 0}.dtabs .btn[aria-pressed=true]{background:var(--bleu);border-color:var(--bleu);color:#fff}.dpills{margin-top:.35rem;display:flex;gap:.3rem;flex-wrap:wrap}.dpills .pill{margin:0}.row small.dwarn,.dwarn{color:#b42318;font-weight:600;font-size:.82rem;margin:.25rem 0 0}.dline{display:grid;grid-template-columns:1fr minmax(120px,auto) minmax(110px,auto) auto;gap:.5rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--gris)}.dline small{color:var(--mut);display:block;overflow-wrap:anywhere}@media(max-width:560px){.dline{grid-template-columns:1fr 1fr}.dl-n{grid-column:1/-1}}.dtb{width:100%;border-collapse:collapse;font-size:.9rem}.dtb th,.dtb td{padding:.5rem .6rem;border-bottom:1px solid var(--gris);text-align:left}.dtb th{color:var(--bleu);font-size:.78rem;letter-spacing:.2px}.dtb .n{text-align:center}.dpre{background:#f6f4ee;border-radius:8px;padding:.8rem;overflow:auto;font-size:.82rem}.jn-und{display:inline-block;margin-top:.35rem;font-size:.78rem;font-weight:700;color:#8a6d1d;background:#fbf3d9;border-radius:999px;padding:.1rem .65rem}#cfm-m{white-space:pre-line;text-align:left}.jn-ajout{background:var(--ok)}.jn-modif{background:var(--bleu2)}.jn-suppr,.jn-purge{background:var(--ko)}.jn-restaure{background:#8a6d1d}.jn-import{background:var(--mut)}
.bd{background:var(--or);color:var(--bleu);border-radius:6px;font-family:'Bebas Neue';letter-spacing:1px;padding:.3rem .6rem;flex-shrink:0;min-width:54px;text-align:center}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 9px;border-radius:10px;margin-right:.4rem;letter-spacing:.2px}
.champ{background:#e8f0fe;color:#1a3a8a}.concours{background:#e8f9ee;color:#1a6a35}.gp{background:#fff8e0;color:#7a5500}.cdc{background:#ffe0f0;color:#8a0050}.jeunes{background:#e0f8ff;color:#005a8a}.veterans{background:#f0ede8;color:#5a3a1a}.regional{background:#f3e8ff;color:#5a1a8a}.coupe{background:#fde8e8;color:#9b1c1c}.propagande{background:#fff0e0;color:#8a4a00}.autre{background:#e9ecef;color:#344054}
.act{display:flex;gap:.4rem;flex-shrink:0}
.act .btn{min-height:40px;padding:.3rem .8rem}
.card{background:#fff;border:1px solid var(--gris);border-radius:12px;padding:1.3rem;margin-bottom:1rem;box-shadow:var(--sh)}
.card>b{display:inline-flex;align-items:center;gap:.45rem;color:var(--bleu)}
.grid{display:grid;grid-template-columns:1fr;gap:0 1rem}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.sec{grid-column:1/-1;font-family:'DM Serif Display';font-weight:400;color:var(--bleu);font-size:1.2rem;margin:.8rem 0 .6rem;padding-bottom:.25rem;border-bottom:1px solid var(--gris)}
.sec:first-child{margin-top:0}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--fond) 35%);padding:1.2rem 0 .3rem}
.empty{text-align:center;color:var(--mut);padding:2.5rem 1rem;background:#fff;border-radius:var(--r);border:1px dashed #cfd5dd}
.empty .ic{display:block;margin:0 auto .5rem;color:#a9b1bd}

/* Fenêtres */
dialog{border:0;border-radius:14px;padding:0;width:min(620px,94vw);max-height:92vh;border-top:5px solid var(--or);box-shadow:var(--sh2);color:var(--txt)}
dialog::backdrop{background:rgba(10,35,66,.6)}
dialog form{padding:1.4rem}
dialog h2{font-family:'Bebas Neue';font-weight:400;letter-spacing:2px;font-size:1.8rem;color:var(--bleu);margin:0 0 1rem}
.mact{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;position:sticky;bottom:0;background:#fff;padding-top:.7rem}
#cfm{width:min(430px,92vw)}
#cfm .cb{padding:1.4rem}
#cfm h2{font-size:1.6rem;margin-bottom:.4rem}
#cfm p{margin:0;color:var(--mut)}

/* Notification */
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--bleu);color:#fff;padding:.85rem 1.3rem;border-radius:10px;z-index:99;max-width:92vw;border-left:5px solid var(--or);box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;align-items:center;gap:.6rem;animation:up .25s ease}
#toast.err{background:var(--ko);border-left-color:#fff}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* Tableaux de classement */
.tw{overflow-x:auto;border:1px solid var(--gris);border-radius:8px}
.tbl{border-collapse:collapse;min-width:100%}
.tbl th,.tbl td{padding:3px;background:#fff}
.tbl input{min-height:38px;padding:.4rem .5rem;font-size:.9rem;min-width:110px}
.tbl .th{font-weight:700;background:#faf6e8;border-color:var(--or)}
.tbl th{white-space:nowrap}
.rn{color:#889;font-size:.8rem;text-align:center;padding:0 .5rem!important}
.x{background:none;border:0;color:var(--ko);min-width:38px;min-height:38px;border-radius:6px;display:inline-grid;place-items:center;vertical-align:middle}
.x:hover{background:#fdeceb}
.hint2{color:var(--mut);font-size:.88rem;margin:.3rem 0 .7rem}
.flex{display:flex;gap:.5rem;flex-wrap:wrap}

.card.unread{border-left:5px solid var(--or)}
.row.flash{animation:flash 2.2s ease-out}@keyframes flash{0%,50%{background:#fbf3d9;border-color:var(--or);box-shadow:0 0 0 3px rgba(201,168,76,.35)}}
@media(prefers-reduced-motion:reduce){.row.flash{animation:none;background:#fbf3d9}}
.msg{padding:1.1rem 1.2rem}
.msg-top{display:flex;align-items:center;gap:.8rem}
.msg-av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--bleu);color:var(--or);display:grid;place-items:center;font-family:'Bebas Neue';letter-spacing:1px;font-size:1.25rem;line-height:1}
.card.unread .msg-av{box-shadow:0 0 0 3px #fbf3d9}
.msg-who{flex:1;min-width:0}
.msg-who strong{display:block;color:var(--bleu);overflow-wrap:anywhere;line-height:1.2}
.msg-who time{display:block;color:var(--mut);font-size:.8rem}
.msg-side{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}.msg-side .pill{margin:0}
.msg-sujet{font-family:'DM Serif Display';font-weight:400;font-size:1.15rem;color:var(--bleu);margin:.8rem 0 .4rem;overflow-wrap:anywhere}
.msg-txt{white-space:pre-wrap;margin:0 0 1rem;padding:.8rem 1rem;background:#faf8f2;border-left:3px solid var(--or);border-radius:0 8px 8px 0;overflow-wrap:anywhere}
.msg-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.msg-tags span{background:#f1efe8;border-radius:99px;padding:.2rem .75rem;font-size:.8rem;color:var(--txt);overflow-wrap:anywhere}
.msg-tags b{color:var(--mut);font-size:.68rem;letter-spacing:1px;text-transform:uppercase;margin-right:.25rem}
.msg-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.5rem;margin:0 0 1rem}
.msg-info>div{border:1px solid var(--gris);border-radius:8px;padding:.45rem .4rem .45rem .8rem;min-width:0}
.msg-info dt{font-size:.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.msg-info dd{margin:0;display:flex;align-items:center;justify-content:space-between;gap:.4rem;min-height:40px}
.msg-info dd a{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.msg-info dd>span{overflow-wrap:anywhere;min-width:0}
.msg-info .cp{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--bleu)}
.msg-info .cp:hover{background:#fbf3d9}
.note2{background:#fbf7e9;border-left:4px solid var(--or);border-radius:8px;padding:.8rem 1rem;color:#5b4a14;font-size:.9rem;margin-bottom:1rem}
code{background:#f1efe8;padding:0 .3em;border-radius:4px;font-size:.85em}
.f:has(.dz){grid-column:1/-1}
.dz{display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center;padding:1.3rem 1rem;border:2px dashed #c4cad3;border-radius:10px;background:#fcfbf7;color:var(--bleu);cursor:pointer;transition:border-color .15s,background .15s}
.dz:hover,.dz.over{border-color:var(--or);background:#fbf7e9}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem;margin-bottom:.7rem}
.phgrid .ph{position:relative;border:1px solid #d5d9e0;border-radius:10px;overflow:hidden;background:#f3f4f6}
.phgrid .ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.phgrid .ph.miss{min-height:70px;display:flex;align-items:center;justify-content:center;color:#b42318;font-weight:700;font-size:.8rem;text-align:center}
.phgrid .ph.miss img{display:none}
.phgrid .ph.miss::after{content:'Fichier introuvable'}
.dz b{display:inline-flex;align-items:center;gap:.4rem}
.dz small{color:var(--mut);overflow-wrap:anywhere}

const ic = (n, s = 18) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* Notifications, confirmation, état « en cours » */
const toast = (m, err) => { const t = $('#toast'); t.className = err ? 'err' : ''; t.innerHTML = ic(err ? 'alert' : 'ok', 18) + '<span></span>'; t.lastChild.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 4200); };

  const d = $('#cfm'); $('#cfm-t').textContent = title; $('#cfm-m').textContent = msg; $('#cfm-y').textContent = label;

});
async function busy(btn, fn) { const h = btn.innerHTML; btn.disabled = true; btn.classList.add('load'); try { return await fn(); } finally { btn.disabled = false; btn.classList.remove('load'); btn.innerHTML = h; } }

});

/* [clé, libellé, type, options] — type "h" = titre de section */
const SCHEMA = {

      ['h', 'Liens (facultatif)'], ['lienTexte', 'Texte du 1er bouton (ex : Règlement)'], ['lien', 'Adresse du 1er lien (https://…)', 'url'], ['lien2Texte', 'Texte du 2e bouton (ex : Inscription)'], ['lien2', 'Adresse du 2e lien (https://…)', 'url']] },

document.addEventListener('click', async e => {
  const box = e.target.closest('#hbPerso'); if (!box || !cache.home || !cache.home.edit) return;

  if (a === 'def' && isSup()) { await busy(pb, async () => { try { await setDoc(doc(db, 'settings', 'accueilAdmin'), { defaut: normHome(E), majLe: Date.now(), par: me.nom || '' }); cache.homeDef = normHome(E); await logAct('modif', 'Accueil admin', 'Disposition de départ', 'Définie par un super admin'); toast('Disposition de départ enregistrée'); } catch (er) { toast('Échec : ' + er.message, 1); } }); }

document.addEventListener('change', e => {

/* Formulaires */
const titleCase = t => String(t || '').toLowerCase().replace(/(^|[\s\-'’])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const clubSelect = (k, val) => {
  const opts = (cache.clubsList || []).filter(c => c.ville).map(c => ({ label: titleCase(c.ville) + (c.assoc ? ' — ' + c.assoc : ''), lieu: titleCase(c.ville) }));
  if (val && !opts.some(o => o.label === val)) opts.push({ label: val, lieu: '' });
  return `<select id="x_${k}" name="${k}"><option value="">— Choisir un club —</option>${opts.map(o => `<option value="${esc(o.label)}" data-lieu="${esc(o.lieu)}" ${o.label === val ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}<option value="__autre">Autre lieu (je le saisis moi-même)</option></select>`;
};
const field = (f, v, req = []) => { const [k, l, t = 'text', o] = f, val = v ?? '';
  if (k === 'h') return `<h3 class="sec">${l}</h3>`;
  const lab = `<label for="x_${k}">${l}${req.includes(k) ? '<span class="rq" aria-hidden="true">*</span>' : ''}</label>`;
  return `<div class="f">${lab}` + (t === 'textarea' ? `<textarea id="x_${k}" name="${k}" rows="3">${esc(val)}</textarea>`
    : t === 'clubselect' ? clubSelect(k, val)
    : t === 'photos' ? '<div id="phs" role="group" aria-label="Photos de l\'actualité"></div>'
    : t === 'xlsx' ? '<div class="dz" id="dz" tabindex="0" role="button" aria-label="Zone de dépôt du fichier Excel"></div><p id="dzn" class="hint2" role="status"></p>'
    : t === 'select' ? `<select id="x_${k}" name="${k}">${o.map(([a, b]) => `<option value="${esc(a)}" ${a === val ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>`
    : `<input id="x_${k}" name="${k}" type="${t === 'url' ? 'text' : t}" ${t === 'url' ? 'inputmode="url" placeholder="https://…"' : ''} ${t === 'number' ? 'min="0"' : ''} value="${esc(val)}">`) + '</div>'; };
const read = (fs, root) => Object.fromEntries(fs.filter(f => f[0] !== 'h' && f[2] !== 'xlsx' && f[2] !== 'photos').map(f => { const el = root.querySelector(`[name=${f[0]}]`); let v = el.value.trim();
  if (f[2] === 'clubselect' && v === '__autre') v = ''; if (f[2] === 'number') v = Number(v) || 0; if (f[2] === 'url' && v && !/^(https?:|mailto:)/i.test(v)) v = (/^[\w\-./]+\.(pdf|xlsx?|docx?|csv|png|jpe?g)$/i.test(v) && !/^www\./i.test(v)) ? v.replace(/^\//, '') : 'https://' + v; return [f[0], v]; }));

/* Dépôt d'un fichier Excel : chaque feuille devient un tableau (comme les classements) */
let feuilles = [];
const LIM = 900000;   // limite d'un document Firestore ≈ 1 Mo
function toSheets(wb) {
  return wb.SheetNames.map(nom => {
    let rows = XLSX.utils.sheet_to_json(wb.Sheets[nom], { header: 1, defval: '', raw: false }).map(r => r.map(c => String(c).trim())).filter(r => r.some(Boolean));
    if (!rows.length) return null;
    const cnt = r => r.filter(Boolean).length, w = Math.max(...rows.slice(0, 30).map(cnt));
    rows = rows.slice(Math.max(0, rows.slice(0, 6).findIndex(r => cnt(r) >= Math.ceil(w * .6))));   // saute les lignes de titre avant l'en-tête
    const n = Math.max(...rows.map(r => r.length)), fix = r => Array.from({ length: n }, (_, i) => r[i] ?? '');
    return { nom, colonnes: fix(rows[0]), lignes: rows.slice(1).map(r => ({ v: fix(r) })) };
  }).filter(s => s && (s.lignes.length || s.colonnes.some(Boolean)));
}

/* Lecture d'un fichier Excel de classement. Un tableau normal : la 1re ligne = les colonnes.
   Une simple liste en une colonne (ex : « Vétéran : né en 1966 et avant ») : chaque ligne est coupée en deux colonnes au « : ». */
async function readTable(file) {
  await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }), nom = wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[nom], { header: 1, defval: '', raw: false }).map(r => r.map(x => String(x).trim())).filter(r => r.some(Boolean));
  if (!rows.length) throw new Error('Fichier vide ou illisible.');
  const w = Math.max(...rows.map(r => r.reduce((m, x, i) => x ? i + 1 : m, 0)));
  if (w <= 1) {
    if (rows.every(r => r[0].includes(':'))) return { colonnes: ['Catégorie', 'Année de naissance'], lignes: rows.map(r => { const i = r[0].indexOf(':'); return { v: [r[0].slice(0, i).trim(), r[0].slice(i + 1).trim()] }; }) };
    return { colonnes: [nom], lignes: rows.map(r => ({ v: [r[0]] })) };
  }
  const fix = r => Array.from({ length: w }, (_, i) => r[i] ?? '');
  if (rows.length < 2) throw new Error('Fichier vide ou illisible.');
  return { colonnes: fix(rows[0]), lignes: rows.slice(1).map(r => ({ v: fix(r) })) };
}

  { titre: '4. Cookies et services tiers',
    texte: "Le site n'utilise aucun cookie publicitaire ni de suivi. Pour s'afficher, ses pages chargent des polices de caractères et des bibliothèques depuis des serveurs tiers (Google, Cloudflare), qui reçoivent alors votre adresse IP." },
  { titre: '5. Vos droits',
    texte: "Vous pouvez demander l'accès à vos données, leur rectification, leur effacement, la limitation de leur traitement, ou vous y opposer. Quand une donnée est publiée avec votre accord, vous pouvez le retirer à tout moment : elle sera retirée du site rapidement. Écrivez à l'adresse indiquée plus haut ; nous répondons dans un délai d'un mois.\n\nSi vous estimez que vos droits ne sont pas respectés, vous pouvez saisir la CNIL : [www.cnil.fr](https://www.cnil.fr), 3 Place de Fontenoy, TSA 80715, 75334 Paris Cedex 07." }
];
let P;
function diffPriv(a, b) {
  const L = [chg('Date de mise à jour', a.majLe, b.majLe)], A = a.sections || [], B = b.sections || [];
  const ta = new Set(A.map(x => x.titre)), tb = new Set(B.map(x => x.titre));
  A.filter(x => !tb.has(x.titre)).forEach(x => { const m = B.find(y => !ta.has(y.titre) && y.texte === x.texte); L.push(m ? `Section renommée : ${q(x.titre)} → ${q(m.titre)}` : `Section supprimée : ${q(x.titre)}`); });
  B.filter(x => !ta.has(x.titre) && !A.some(y => !tb.has(y.titre) && y.texte === x.texte)).forEach(x => L.push(`Section ajoutée : ${q(x.titre)}`));
  B.forEach(x => { const o = A.find(y => y.titre === x.titre); if (o) L.push(chg('Section ' + q(x.titre) + ' — texte', o.texte, x.texte)); });
  const ordA = A.filter(x => tb.has(x.titre)).map(x => x.titre).join('|'), ordB = B.filter(x => ta.has(x.titre)).map(x => x.titre).join('|');
  if (ordA !== ordB) L.push('Ordre des sections modifié');
  return L.filter(Boolean).join('\n') || 'Aucun texte modifié';
}
function syncP() { if (!$('#pmaj')) return; P.majLe = $('#pmaj').value; P.sections = [...document.querySelectorAll('.psec')].map(c => ({ titre: c.querySelector('.pt').value, texte: c.querySelector('.px').value })); }
async function viewPrivacy() {
  const d = (await getDoc(doc(db, 'settings', 'confidentialite'))).data();
  const saved = !!(d && d.sections && d.sections.length);
  P = { saved, majLe: (d && d.majLe) || today, sections: (saved ? d.sections : DEFAULT_PRIVACY).map(s => ({ titre: s.titre || '', texte: s.texte || '' })) }; P.orig = JSON.parse(JSON.stringify({ majLe: P.majLe, sections: P.sections }));
  drawPrivacy();
}
function drawPrivacy() {
  $('#main').innerHTML = head('Confidentialité', 'Les textes de la page « Confidentialité » du site. Modifie-les ici, enregistre, et la page est mise à jour.') +
  `<div class="note2">${P.saved ? 'Ces textes sont ceux enregistrés dans la base : la page du site les affiche.' : 'Ces textes sont ceux actuellement écrits dans la page. Tant que tu n\'as pas cliqué sur « Enregistrer », la page garde son texte d\'origine.'}</div>
  <div class="card"><div class="grid"><div class="f"><label for="pmaj">Date de dernière mise à jour (affichée en haut de la page)</label><input id="pmaj" type="date" value="${esc(P.majLe)}"></div></div>
    <p class="hint2"><b>Mise en forme :</b> une ligne vide sépare deux paragraphes · une ligne qui commence par « - » devient une puce · <code>**texte**</code> met en gras · <code>[texte](https://adresse)</code> crée un lien · <code>{adresse}</code> et <code>{email}</code> sont remplacés par l'adresse et l'email des « Infos du site ».</p></div>
  ${P.sections.map((s, i) => `<div class="card psec"><div class="f"><label for="pt${i}">Titre de la section ${i + 1}</label><input id="pt${i}" class="pt" value="${esc(s.titre)}"></div>
    <div class="f"><label for="px${i}">Texte</label><textarea id="px${i}" class="px" rows="${Math.min(14, Math.max(4, (s.texte.match(/\n/g) || []).length + 3))}">${esc(s.texte)}</textarea></div>
    <div class="flex"><button class="btn b-ln" data-pa="up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Monter la section">↑ Monter</button><button class="btn b-ln" data-pa="dn" data-i="${i}" ${i === P.sections.length - 1 ? 'disabled' : ''} aria-label="Descendre la section">↓ Descendre</button><button class="btn b-ko" data-pa="del" data-i="${i}">${ic('trash', 16)}Supprimer la section</button></div></div>`).join('')}
  <div class="flex"><button class="btn b-ln" data-pa="add">${ic('plus', 16)}Ajouter une section</button><button class="btn b-ln" data-pa="reset">${ic('undo', 16)}Remettre le texte d'origine</button><a class="btn b-ln" href="confidentialite.html" target="_blank" rel="noopener">${ic('ext', 16)}Voir la page</a></div>
  <div class="savebar"><button class="btn b-or" id="psv">${ic('save')}Enregistrer la page Confidentialité</button></div>`;
  $('#main').onclick = async e => { const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'psv') return busy(b, async () => { syncP(); const sec = P.sections.map(s => ({ titre: s.titre.trim(), texte: s.texte.trim() })).filter(s => s.titre || s.texte);
      if (!sec.length) return toast('Ajoute au moins une section.', 1);
      try { const apres = { majLe: P.majLe, sections: sec }; await setDoc(doc(db, 'settings', 'confidentialite'), apres); await logAct('modif', 'Page Confidentialité', 'Textes de la page', diffPriv(P.orig, apres), { snap: snapOf('mod', 'settings', 'confidentialite', P.orig, apres) }); P.orig = JSON.parse(JSON.stringify({ majLe: P.majLe, sections: sec })); P.saved = true; toast('Enregistré — la page Confidentialité est à jour'); drawPrivacy(); } catch (er) { toast('Échec : ' + er.message, 1); } });
    const a = b.dataset.pa; if (!a) return; syncP(); const i = +b.dataset.i;
    if (a === 'add') P.sections.push({ titre: (P.sections.length + 1) + '. Nouveau titre', texte: '' });
    else if (a === 'up' && i > 0) [P.sections[i - 1], P.sections[i]] = [P.sections[i], P.sections[i - 1]];
    else if (a === 'dn' && i < P.sections.length - 1) [P.sections[i + 1], P.sections[i]] = [P.sections[i], P.sections[i + 1]];
    else if (a === 'del') { if (!await ask('Supprimer cette section ?', 'Elle disparaîtra de la page après l\'enregistrement.')) return; P.sections.splice(i, 1); }
    else if (a === 'reset') { if (!await ask('Remettre le texte d\'origine ?', 'Tes modifications non enregistrées seront perdues. Clique ensuite sur « Enregistrer » pour l\'appliquer.', 'Remettre')) return; P.sections = DEFAULT_PRIVACY.map(s => ({ ...s })); }
    drawPrivacy(); };
}

const KIND = { designations: ['Désignation', d => d.titre || d.nom], events: ['Compétition', d => d.titre], clubs: ['Club', d => d.ville], membres: ['Membre', d => d.nom], classements: ['Classement', d => d.nom], actualites: ['Actualité', d => d.titre], annuaire: ['Site', d => d.nom], archives: ['Archive', d => d.titre], documentations: ['Documentation', d => d.titre], championnats: ['Championnat', d => d.titre], coupedefrance: ['Coupe de France', d => d.titre], regionaux: ['Régionaux / France', d => d.titre], championnatsclubs: ['Champ. des clubs', d => d.titre], messages: ['Message', d => `${d.nom} — ${d.sujet || 'Sans sujet'}`] };
const fdate = t => t ? new Date(t).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

async function trash(col, id, x, opts = {}) {
  const { _id, ...data } = x, b = writeBatch(db), cr = doc(collection(db, 'corbeille'));
  b.set(cr, { col, origId: id, data, label: KIND[col][1](data) || 'Sans titre', supprimeLe: Date.now() });
  b.delete(doc(db, col, id)); await b.commit();
  await logAct('suppr', objetDe(col, data), labelDe(col, data), 'Mis à la corbeille (restaurable 30 jours)', { ref: opts.ref, snap: JSON.stringify({ v: 1, k: 'del', c: col, i: id, cid: cr.id }) });
}
let badgeAt = 0, badgeN = 0;
async function badge(force) {
  try { if (force || Date.now() - badgeAt > 60000) { badgeN = (await getDocs(collection(db, 'messages'))).docs.filter(d => !d.data().lu).length; badgeAt = Date.now(); }
    document.querySelectorAll('.nb').forEach(n => n.remove());
    const n = badgeN;
    if (!n) return;
    document.querySelector('#tabs [data-t=messages]')?.insertAdjacentHTML('beforeend', `<span class="nb" aria-label="${n} non lus">${n}</span>`);
    burger.insertAdjacentHTML('beforeend', `<span class="nb dot" aria-label="${n} messages non lus"></span>`); } catch {}
}

/* ===== Bloc-notes partagé =====
   Notes internes visibles par tous les administrateurs (collection « notes »), jamais affichées sur le site. */
let notesFilter = 'todo';
async function viewNotes() {
  const l = (await getDocs(collection(db, 'notes'))).docs.map(d => ({ ...d.data(), _id: d.id }));
  let editId = null;
  const who = () => me.nom || (auth.currentUser?.email || '').toLowerCase() || 'Inconnu';
  $('#main').innerHTML = head('Bloc-notes', 'Notes partagées entre tous les administrateurs : rappels, choses à faire, informations utiles. Elles ne sont jamais visibles sur le site.') +
    `<div class="card"><div class="f" style="margin-bottom:.7rem"><label for="nt">Nouvelle note</label><textarea id="nt" rows="3" placeholder="Ex : relancer le club de Roye pour la licence… (Ctrl + Entrée pour ajouter)"></textarea></div>
    <button class="btn b-or" data-a="add">${ic('plus')}Ajouter la note</button></div>
    <div class="st-top" role="group" aria-label="Filtrer les notes"><button data-f="todo"></button><button data-f="done"></button><button data-f="all"></button><button data-a="refresh" title="Voir les notes ajoutées par les autres">${ic('undo', 16)} Actualiser</button></div><div id="list"></div>`;
  const draw = () => {
    const cnt = { todo: l.filter(n => !n.fait).length, done: l.filter(n => n.fait).length, all: l.length };
    document.querySelectorAll('.st-top [data-f]').forEach(b => { b.classList.toggle('on', b.dataset.f === notesFilter); b.textContent = ({ todo: 'À faire', done: 'Faites', all: 'Toutes' })[b.dataset.f] + ' (' + cnt[b.dataset.f] + ')'; });
    const v = l.filter(n => notesFilter === 'all' || (notesFilter === 'done' ? n.fait : !n.fait)).sort((a, b) => (b.epingle ? 1 : 0) - (a.epingle ? 1 : 0) || (b.creeLe || 0) - (a.creeLe || 0));
    $('#list').innerHTML = v.length ? v.map(n => n._id === editId
      ? `<div class="card"><textarea id="ne" rows="4" aria-label="Modifier la note">${esc(n.texte)}</textarea><div class="flex" style="margin-top:.7rem"><button class="btn b-or" data-a="save" data-id="${n._id}">${ic('save', 16)}Enregistrer</button><button class="btn b-ln" data-a="cancel">Annuler</button></div></div>`
      : `<div class="row ${n.fait ? 'past' : ''}"><button class="btn b-ln b-ic" data-a="fait" data-id="${n._id}" aria-pressed="${!!n.fait}" aria-label="${n.fait ? 'Marquer à faire' : 'Marquer comme faite'}" title="${n.fait ? 'Marquer à faire' : 'Marquer comme faite'}">${ic(n.fait ? 'ok' : 'circle', 20)}</button>
        <div class="m"><strong style="white-space:pre-wrap;font-weight:600;${n.fait ? 'text-decoration:line-through' : ''}">${esc(n.texte)}</strong>
        <small>${n.epingle ? '📌 ' : ''}${esc(n.auteur || 'Inconnu')} · ${fdate(n.creeLe)}${n.majPar ? ` · modifiée par ${esc(n.majPar)} le ${fdate(n.majLe)}` : ''}${n.fait && n.faitPar ? ` · faite par ${esc(n.faitPar)}` : ''}</small></div>
        <div class="act"><button class="btn b-ln b-ic" data-a="pin" data-id="${n._id}" aria-pressed="${!!n.epingle}" aria-label="${n.epingle ? 'Désépingler' : 'Épingler en haut'}" title="${n.epingle ? 'Désépingler' : 'Épingler en haut'}">${ic('pinned', 16)}</button><button class="btn b-ln b-ic" data-a="edit" data-id="${n._id}" aria-label="Modifier" title="Modifier">${ic('edit', 16)}</button><button class="btn b-ko b-ic" data-a="del" data-id="${n._id}" aria-label="Supprimer" title="Supprimer">${ic('trash', 16)}</button></div></div>`).join('')
      : empty(notesFilter === 'done' ? 'Aucune note terminée.' : notesFilter === 'todo' ? 'Rien à faire : toutes les notes sont terminées, ou aucune note n\'a encore été ajoutée.' : 'Aucune note pour le moment.', 'note');
  };
  const fail = er => toast('Échec : ' + er.message + (/permission/i.test(er.message) ? ' — vérifie les règles Firebase (collection « notes »).' : ''), 1);
  draw();
  $('#nt').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#main').querySelector('[data-a=add]').click(); } };
  $('#main').onclick = async e => {
    const fb = e.target.closest('[data-f]'); if (fb) { notesFilter = fb.dataset.f; return draw(); }
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, n = l.find(x => x._id === b.dataset.id);
    try {
      if (a === 'refresh') return viewNotes();
      if (a === 'cancel') { editId = null; return draw(); }
      if (a === 'add') {
        const t = $('#nt').value.trim(); if (!t) return toast('Écris d\'abord ta note.', 1);
        await busy(b, async () => { const d = { texte: t, auteur: who(), creeLe: Date.now(), fait: false, epingle: false }; const ref = await addDoc(collection(db, 'notes'), d); l.push({ ...d, _id: ref.id }); $('#nt').value = ''; if (notesFilter === 'done') notesFilter = 'todo'; draw(); toast('Note ajoutée'); });
        return;
      }
      if (!n) return;
      if (a === 'fait') { const p = { fait: !n.fait, faitPar: n.fait ? '' : who() }; await updateDoc(doc(db, 'notes', n._id), p); Object.assign(n, p); draw(); }
      else if (a === 'pin') { const p = { epingle: !n.epingle }; await updateDoc(doc(db, 'notes', n._id), p); Object.assign(n, p); draw(); }
      else if (a === 'edit') { editId = n._id; draw(); const t = $('#ne'); t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
      else if (a === 'save') {
        const t = $('#ne').value.trim(); if (!t) return toast('La note ne peut pas être vide.', 1);
        await busy(b, async () => { const p = { texte: t, majLe: Date.now(), majPar: who() }; await updateDoc(doc(db, 'notes', n._id), p); Object.assign(n, p); editId = null; draw(); toast('Note modifiée'); });
      }
      else if (a === 'del' && await ask('Supprimer cette note ?', 'Elle disparaîtra pour tous les administrateurs et ne pourra pas être récupérée.', 'Supprimer')) { await deleteDoc(doc(db, 'notes', n._id)); l.splice(l.indexOf(n), 1); draw(); toast('Note supprimée'); }
    } catch (er) { fail(er); }
  };
}


/* ===== Comptes administrateurs (réservé aux super admins) ===== */
const rolePill = r => `<span class="pill" style="background:${r === 'super' ? 'var(--bleu)' : r === 'editeur' ? 'rgba(201,168,76,.25)' : '#e8ebf0'};color:${r === 'super' ? 'var(--or)' : 'var(--bleu)'}">${ROLES[r] || r}</span>`;

      ${isNew ? `<div class="f" style="margin-top:.7rem"><label for="c-pw">Mot de passe provisoire (6 caractères minimum)</label><input id="c-pw" type="text" autocomplete="off" placeholder="À communiquer à la personne, qui pourra le changer"></div>
      <div class="f" style="margin-top:.7rem"><label for="c-uid">Compte déjà existant dans Firebase ? Colle son identifiant (UID) ici — sinon laisse vide</label><input id="c-uid" autocomplete="off" placeholder="Facultatif"></div>` : ''}
      <div class="f" style="margin-top:.7rem"><label for="c-role">Niveau d'accès</label><select id="c-role" ${self ? 'disabled' : ''}>${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${k === role ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <p class="hint2" id="c-help"></p></div>
      <div class="f" style="margin-top:.7rem"><label for="c-acc">Accueil de cette personne</label><select id="c-acc"><option value="">${isNew ? 'Disposition par défaut du comité' : 'Ne pas modifier'}</option><option value="simple">Accueil simplifié : seulement le calendrier et les actualités</option><option value="complet">Accueil complet (tous les blocs)</option></select><p class="hint2">La personne pourra ensuite l'adapter elle-même avec le bouton « Personnaliser » de son accueil.</p></div>
      <div id="c-rights"></div>
      ${isOwner() ? `<label id="c-imp-w" style="display:flex;align-items:center;gap:.5rem;min-height:36px;margin-top:.8rem;font-weight:500"><input type="checkbox" id="c-imp" style="width:20px;height:20px;min-height:0;flex:none" ${!a || a.import !== false ? 'checked' : ''}>Peut utiliser l'onglet Import</label>` : ''}

  const syncForm = () => {

    $('#c-help').textContent = help[r.value];

      <small>${a.role === 'super' ? 'Accès à tout' : (a.droits || []).length + ' partie' + ((a.droits || []).length > 1 ? 's' : '') + ' du site'}</small></div>
      <div class="act">${isProtected(a) ? `<span title="Compte protégé" aria-label="Compte protégé">${ic('lock', 16)}</span>` : `<button class="btn b-ln b-ic" data-a="edit" data-id="${a._id}" aria-label="Modifier" title="Modifier">${ic('edit', 16)}</button>`}</div></div>`).join('') : empty('Aucun compte enregistré.', 'users');
    $('#cslot').innerHTML = adding ? form(null) : editId ? form(l.find(x => x._id === editId)) : '';

    `<div class="flex" style="margin-bottom:1rem"><button class="btn b-or" id="cadd">${ic('plus')}Ajouter un compte</button><button class="btn b-ln" id="cme">${ic('lock', 16)}Changer mon mot de passe</button></div><div id="cslot"></div><div id="clist"></div>`;
  const fail = er => toast('Échec : ' + er.message, 1);
  $('#cme').onclick = () => { tab = 'moncompte'; start(); window.scrollTo(0, 0); };
  $('#cadd').onclick = () => { adding = true; editId = null; draw(); $('#c-nom').focus(); };
  $('#main').onchange = e => { if (e.target.id === 'c-role') syncForm(); };
  $('#main').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, acc = l.find(x => x._id === b.dataset.id);
    if (isProtected(acc) || (a === 'save' && !adding && isProtected(l.find(x => x._id === editId)))) return toast('Ce compte est protégé : seul son propriétaire peut le modifier.', 1);
    try {
      if (a === 'cancel') { adding = false; editId = null; return draw(); }
      if (a === 'edit') { editId = b.dataset.id; adding = false; draw(); $('#cform').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      if (a === 'all' || a === 'none') { document.querySelectorAll('#c-rights [data-r]').forEach(x => x.checked = a === 'all'); return; }
      if (a === 'reset' && acc) { await sendPasswordResetEmail(auth, acc.email); return toast('E-mail envoyé à ' + acc.email); }
      if (a === 'del' && acc) {
        if (acc.role === 'super' && nSup() <= 1) return toast('Impossible : il doit rester au moins un super admin.', 1);
        if (await ask('Retirer l\'accès à ' + (acc.nom || acc.email) + ' ?', 'Cette personne ne pourra plus se connecter à l\'administration. Son compte de connexion reste dans Firebase (tu peux le supprimer là-bas si tu veux). Tu pourras lui redonner l\'accès plus tard.', 'Retirer')) {
          await deleteDoc(doc(db, 'admins', acc._id)); l = l.filter(x => x !== acc); editId = null; draw(); toast('Accès retiré'); logAct('suppr', 'Compte admin', acc.nom || acc.email);
        }
        return;
      }
      if (a === 'save') {
        const nom = $('#c-nom').value.trim(), role = $('#c-role').value, sup = role === 'super';
        const droits = sup ? ALL_R() : [...document.querySelectorAll('#c-rights [data-r]')].filter(x => x.checked).map(x => x.dataset.r);
        if (!nom) return toast('Écris le nom de la personne.', 1);
        if (!sup && !droits.length) return toast('Coche au moins une partie du site.', 1);
        /* Sans la case (non-propriétaire) : on conserve la valeur actuelle, et jamais d'import pour un nouveau compte. */
        const impEl = $('#c-imp'), prevAcc = adding ? null : l.find(x => x._id === editId);
        const imp = sup && (impEl ? impEl.checked : !!prevAcc && prevAcc.import !== false);
        if (adding) {
          const email = $('#c-em').value.trim().toLowerCase(), pw = $('#c-pw').value, uid0 = $('#c-uid').value.trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Adresse e-mail invalide.', 1);
          if (!uid0 && pw.length < 6) return toast('Le mot de passe doit faire au moins 6 caractères.', 1);
          if (l.some(x => (x.email || '').toLowerCase() === email)) return toast('Cette adresse a déjà un profil.', 1);
          await busy(b, async () => {
            let uid = uid0;
            if (!uid) { /* connexion secondaire : crée le compte sans déconnecter l'administrateur actuel */
              const sec = initializeApp(getApp().options, 'creation-' + Date.now());
              try { uid = (await createUserWithEmailAndPassword(getAuth(sec), email, pw)).user.uid; await signOut(getAuth(sec)); }
              catch (er) { throw new Error(er.code === 'auth/email-already-in-use' ? 'Cette adresse existe déjà dans Firebase : colle son identifiant (UID) dans le champ prévu, ou utilise « nouveau mot de passe » depuis la console.' : er.code === 'auth/weak-password' ? 'Mot de passe trop faible.' : er.message); }
              finally { try { await deleteApp(sec); } catch {} }
            }
            const d = { email, nom, role, actif: true, droits, import: imp, creeLe: Date.now(), creePar: me.nom || (auth.currentUser.email || '') };
            if (HPRESET[$('#c-acc').value]) d.accueil = normHome(HPRESET[$('#c-acc').value]);
            await setDoc(doc(db, 'admins', uid), d); l.push({ ...d, _id: uid }); adding = false; draw(); toast('Compte créé');
            logAct('ajout', 'Compte admin', nom, ROLES[role] + ' — ' + email);
          });
        } else {
          const cur = l.find(x => x._id === editId), self = cur._id === me.uid, actifEl = $('#c-actif'), actif = actifEl ? actifEl.checked : true;
          if (cur.role === 'super' && (role !== 'super' || !actif) && nSup() <= 1) return toast('Impossible : il doit rester au moins un super admin.', 1);
          await busy(b, async () => {
            const p = { nom, role: self ? 'super' : role, droits, import: imp, actif: self || HARD.includes(cur._id) ? true : actif, majLe: Date.now() };
            if (HPRESET[$('#c-acc').value]) p.accueil = normHome(HPRESET[$('#c-acc').value]);
            await updateDoc(doc(db, 'admins', cur._id), p); Object.assign(cur, p); if (self) me.nom = nom; editId = null; draw(); toast('Compte enregistré');
            logAct('modif', 'Compte admin', nom, ROLES[p.role] + (p.actif ? '' : ' — désactivé'));
          });
        }
      }
    } catch (er) { fail(er); }
  };
  draw();
}


/* ===== Mon mot de passe (tous les comptes) : changement direct, sans e-mail ===== */
function viewMonCompte() {

    <label style="display:flex;align-items:center;gap:.5rem;min-height:36px;margin-top:.6rem;font-weight:500"><input type="checkbox" id="mp-show" style="width:20px;height:20px;min-height:0;flex:none">Afficher les mots de passe</label>

    if (n.length < 6) return toast('Le nouveau mot de passe doit faire au moins 6 caractères.', 1);
    if (n !== n2) return toast('Les deux nouveaux mots de passe sont différents.', 1);
    if (n === o) return toast('Le nouveau mot de passe doit être différent de l\'ancien.', 1);
    await busy(e.currentTarget, async () => {

      }
    });
  };
}

/* ===== Journal d'activité ===== */
const ACT = { ajout: 'a ajouté', modif: 'a modifié', suppr: 'a supprimé', restaure: 'a restauré', purge: 'a supprimé définitivement', import: 'a importé' };
const ACTL = { ajout: 'Ajouts', modif: 'Modifications', suppr: 'Suppressions', restaure: 'Restaurations', purge: 'Suppressions définitives', import: 'Imports' };
const jrow = (x, compact) => { const L = String(x.detail || '').split('\n').filter(Boolean), multi = L.length > 1 || (x.action === 'modif' && /^.+ : .+→.+$|remplacé par|ajout de|retrait de/.test(L[0] || ''));
  const det = !L.length ? (x.action === 'modif' ? '<small>aucun champ modifié</small>' : '') : multi ? `<ul class="jd">${(compact ? L.slice(0, 2) : L).map(l => `<li>${esc(l)}</li>`).join('')}${compact && L.length > 2 ? `<li class="more">+ ${L.length - 2} autre${L.length - 2 > 1 ? 's' : ''} changement${L.length - 2 > 1 ? 's' : ''}</li>` : ''}</ul>` : '';
  return `<div class="row"><div class="bd jn-h">${esc(new Date(x.date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }))}</div><div class="m"><strong><span class="jn-who">${esc(x.qui)}</span> <span class="jn jn-${esc(x.action)}">${esc(ACT[x.action] || x.action)}</span> ${esc(x.cible)}</strong><small>${esc(x.objet)}${L.length && !multi ? ' · ' + esc(L[0]) : ''}${x.email ? ' · ' + esc(x.email) : ''}</small>${det}${!compact && UNDONE.has(x._id) ? '<span class="jn-und">↩ annulée depuis</span>' : ''}</div>${!compact && x._id && canUndo(x) ? `<div class="act"><button class="btn b-ln" data-un="${esc(x._id)}">${ic('undo', 16)}${esc(undoLabel(x, parseSnap(x)))}</button></div>` : ''}</div>`; };

    <select id="jw" aria-label="Personne"><option value="">Toutes les personnes</option>${who.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('')}</select>

  const day = t => new Date(t).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const draw = () => { const q = $('#jq').value.toLowerCase(), w = $('#jw').value, a = $('#ja').value;
    const v = l.filter(x => (!q || [x.qui, x.email, x.objet, x.cible, x.detail, ACT[x.action]].join(' ').toLowerCase().includes(q)) && (!w || x.qui === w) && (!a || x.action === a));
    if (!v.length) return $('#list').innerHTML = empty(l.length ? 'Aucune action ne correspond à ta recherche.' : 'Aucune action enregistrée pour le moment. Dès qu\'une personne ajoutera, modifiera ou supprimera quelque chose, ce sera noté ici.', 'clock');
    const g = {}; v.forEach(x => (g[day(x.date)] ||= []).push(x));

/* ===== Désignations des arbitres =====

const DROLES = [['principal', 'Arbitre principal'], ['arbitre', 'Arbitre'], ['delegue', 'Délégué / observateur']];

const EQ_PAR_ARBITRE = 64;

const candidats = (ev, taken) => DS.arbs.filter(m => !taken.has(m._id) && !indispoOf(m._id, ev.date) && !dejaPris(m._id, ev) && rangOf(m.role) >= niveauOf(ev))

const rangOf = r => { const t = norm(r); return /national|federal/.test(t) ? 3 : /region|ligue/.test(t) ? 2 : /departement/.test(t) ? 1 : 0; };

  A.forEach(y => { if (!B.some(x => x.id === y.id)) L.push(`Retrait : ${y.nom}`); });
  const ra = (a && Number.isInteger(a.requis)) ? a.requis : null, rb = Number.isInteger(b.requis) ? b.requis : null; if (ra !== rb) L.push('Arbitres nécessaires : ' + (ra ?? 'auto') + ' → ' + (rb ?? 'auto'));
  const n = chg('Note', (a && a.note) || '', b.note || ''); if (n) L.push(n);
  return L.join('\n');
}

        `<div class="card"><b>${ic('lock')}Autoriser la collection « designations »</b><p class="hint2">Dans la console Firebase › Firestore › Règles, ajoute une règle réservée aux administrateurs (même principe que pour la collection « journal » ou « notes »), puis publie. Exemple à adapter :</p><pre class="dpre">match /designations/{id} {\n  allow read, write: if request.auth != null\n    &amp;&amp; get(/databases/$(database)/documents/admins/$(request.auth.uid)).data.actif == true;\n}</pre></div>`;

/* Liste « À traiter » partagée par l'accueil et le tableau de bord. Une donnée absente (null = collection inaccessible) est simplement ignorée. */
function buildTodo({ events, clubs, messages, actus, notes }) {
  const DAY = 864e5, todo = [], add = (lvl, k, txt, go) => k > 0 && todo.push({ lvl, k, txt, go });
  const plus = n => new Date(Date.now() + n * DAY).toISOString().slice(0, 10);
  if (messages) {
    add('hi', messages.filter(m => !m.lu).length, 'message(s) non lu(s) dans la boîte de contact', 'messages');
    add('mid', messages.filter(m => m.lu && !m.traite).length, 'message(s) lu(s) mais pas encore marqué(s) « traité »', 'messages');
  }
  if (clubs) {
    add('mid', clubs.filter(c => (c.adresse || c.tel || c.email) && !c.consentement).length, 'club(s) dont l\'adresse, le téléphone ou l\'email est renseigné mais masqué sur le site (accord du dirigeant non enregistré)', 'clubs');
    add('lo', clubs.filter(c => !c.tel && !c.email).length, 'club(s) sans téléphone ni email', 'clubs');
  }
  if (events) {
    const nx = events.filter(e => e.date >= today && e.date <= plus(30));
    add('mid', nx.filter(e => !e.lieu || !e.heure).length, 'compétition(s) des 30 prochains jours sans lieu ou sans heure', 'events');
    if (!events.some(e => e.date >= today && e.date <= plus(60))) todo.push({ lvl: 'hi', k: 0, txt: 'Aucune compétition au calendrier dans les 60 prochains jours', go: 'events' });
  }

    add('lo', actus.filter(a => actuEtat(a) === 'programme').length, 'actualité(s) programmée(s) pour plus tard', 'actualites');
    if (!actus.some(a => actuEtat(a) === 'publie')) todo.push({ lvl: 'mid', k: 0, txt: 'Aucune actualité publiée en ce moment sur la page d\'accueil', go: 'actualites' });
  }

  return todo;
}
const todoHtml = todo => todo.map(t => `<button class="db-it ${t.lvl}" data-go="${t.go}"><b>${t.k || '!'}</b><span>${t.k ? t.txt.replace(/\(s\)/g, t.k > 1 ? 's' : '') : t.txt}</span><em>Ouvrir ›</em></button>`).join('');

const PAGES = { accueil: 'Accueil', comite: 'Le Comité', clubs: 'Les clubs', calendrier: 'Calendrier', annuaire: 'Annuaire', classement: 'Classements', archives: 'Archives', documentations: 'Documentations', cdc: 'Champ. des clubs', championnats: 'Championnats', 'coupe-de-france': 'Coupe de France', regionaux: 'Régionaux / France' };
/* ───────── Tableau de bord ─────────
   Vue d'ensemble : ce qui demande une action, l'audience, les abonnés aux notifications, l'activité des administrateurs.
   Lecture seule. Chaque bloc se débrouille seul : si une collection est inaccessible, les autres s'affichent quand même. */
let dbDays = 30;
async function viewDashboard() {
  const col = async c => { try { return (await getDocs(collection(db, c))).docs.map(d => ({ ...d.data(), _id: d.id })); } catch (e) { return null; } };
  const jr = async () => { try { return (await getDocs(query(collection(db, 'journal'), orderBy('date', 'desc'), limit(500)))).docs.map(d => d.data()); } catch (e) { return null; } };
  const [events, clubs, messages, push, actus, vues, journal] = await Promise.all([col('events'), col('clubs'), col('messages'), col('push_tokens'), col('actualites'), col('stats_vues'), jr()]);
  const DAY = 864e5, now = Date.now(), iso = ms => new Date(ms).toISOString().slice(0, 10), plus = n => iso(now + n * DAY);
  const n = dbDays, plural = (k, a, b) => k > 1 ? b : a;
  const ago = t => { const d = Math.floor((now - t) / DAY); return d <= 0 ? 'aujourd\'hui' : d === 1 ? 'hier' : `il y a ${d} jours`; };
  const trend = (cur, bef) => bef ? (() => { const d = Math.round((cur - bef) / bef * 100); return d === 0 ? 'Stable' : `<span class="${d > 0 ? 'st-up' : 'st-dn'}">${d > 0 ? '▲ +' : '▼ '}${d} %</span> vs période précédente`; })() : 'Pas de période précédente';
  const tile = (l, v, s, cls = '') => `<div class="st-tile"><small>${l}</small><div class="v ${cls}">${v}</div><div class="s">${s}</div></div>`;

  /* Audience */
  const byDay = {};
  (vues || []).forEach(d => { let t = 0; const p = {}; for (const [k, v] of Object.entries(d)) if (k !== '_id' && typeof v === 'number') { p[k] = v; t += v; } byDay[d._id] = { t, p }; });
  const rng = (len, off) => Array.from({ length: len }, (_, i) => { const d = iso(now - (len - 1 - i + off) * DAY); return { d, t: byDay[d]?.t || 0, p: byDay[d]?.p || {} }; });
  const cur = rng(n, 0), prev = rng(n, n), sum = a => a.reduce((x, y) => x + y.t, 0);
  const w7 = sum(rng(7, 0)), w7b = sum(rng(7, 7)), todayN = byDay[iso(now)]?.t || 0, total = sum(cur);
  const long = d => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }), best = cur.reduce((m, x) => x.t > m.t ? x : m, cur[0]);

  /* À traiter */
  const todo = buildTodo({ events, clubs, messages, actus });
  if (vues && Object.keys(byDay).length && rng(3, 0).every(x => !x.t)) todo.push({ lvl: 'mid', k: 0, txt: 'Aucune visite enregistrée depuis 3 jours : vérifier que le comptage fonctionne', go: 'dashboard' });
  const rank = { hi: 0, mid: 1, lo: 2 }; todo.sort((a, b) => rank[a.lvl] - rank[b.lvl]);
  const allKO = [events, clubs, messages, push, actus, vues, journal].every(x => x === null);
  const todoH = allKO ? `<div class="lerr">Impossible de lire les données : vérifie ta connexion et les règles Firestore.</div>` : todo.length ? `<div class="db-todo">${todo.map(t => `<button class="db-it ${t.lvl}" data-go="${t.go}"><b>${t.k || '!'}</b><span>${t.k ? t.txt.replace(/\(s\)/g, t.k > 1 ? 's' : '') : t.txt}</span><em>Ouvrir ›</em></button>`).join('')}</div>` : `<div class="db-ok">✓ Rien à signaler : tout est à jour.</div>`;

  /* Tuiles */
  const nextEv = (events || []).filter(e => e.date >= today).sort(SCHEMA.events.sort)[0];
  const pushN = push ? push.length : null, push30 = push ? push.filter(x => x.creeLe > now - 30 * DAY).length : 0;
  const unread = messages ? messages.filter(m => !m.lu).length : null;
  const tiles = `<div class="st-tiles">${tile('Vues sur 7 jours', vues ? w7 : '—', vues ? trend(w7, w7b) : 'Statistiques inaccessibles')}${tile('Aujourd\'hui', vues ? todayN : '—', plural(todayN, 'page vue', 'pages vues'))}${tile(`Moyenne sur ${n} jours`, vues ? (total / n).toFixed(1).replace('.', ',') : '—', vues && total ? `Meilleur jour : ${esc(long(best.d))} (${best.t})` : 'Aucune visite sur la période')}${tile('Appareils abonnés', pushN ?? '—', pushN === null ? 'Inaccessible' : (push30 ? `+${push30} sur 30 jours` : 'Aucun nouvel abonné sur 30 jours'))}${tile('Messages non lus', unread ?? '—', unread ? 'À lire dans « Messages »' : 'Boîte à jour')}${tile('Prochaine compétition', nextEv ? esc((nextEv.date || '').split('-').reverse().slice(0, 2).join('/')) : '—', nextEv ? esc(nextEv.titre || '') : 'Aucune à venir', 'txt')}</div>`;

  /* Audience : courbe, jours, pages */
  const mx = Math.max(...cur.map(x => x.t), 1), step = Math.ceil(n / 6), short = d => d.slice(8) + '/' + d.slice(5, 7);
  const chart = vues && !Object.values(byDay).some(x => x.t) ? `<div class="st-card"><h2>Fréquentation</h2><p class="ex-empty">Pas encore de visites enregistrées. Les chiffres apparaîtront dès que quelqu'un ouvrira une page du site.</p></div>` : vues ? `<div class="st-card"><h2>Fréquentation</h2><p>Pages vues par jour. Aujourd'hui est en doré.</p>
    <div class="st-chart" role="img" aria-label="Pages vues par jour sur ${n} jours, maximum ${mx}"><span class="mx">${mx} vues</span>${cur.map(x => `<div class="st-col ${x.d === iso(now) ? 'td' : ''}" data-tip="${esc(long(x.d))} : ${x.t} ${x.t > 1 ? 'vues' : 'vue'}"><div class="st-bar" style="height:${x.t / mx * 100}%"></div></div>`).join('')}</div>
    <div class="st-x" aria-hidden="true">${cur.map((x, i) => `<span>${i === n - 1 || i % step === 0 ? short(x.d) : ''}</span>`).join('')}</div></div>` : '';
  const pages = {}; cur.forEach(x => Object.entries(x.p).forEach(([k, v]) => pages[k] = (pages[k] || 0) + v));
  const top = Object.entries(pages).sort((a, b) => b[1] - a[1]);
  const wd = [0, 0, 0, 0, 0, 0, 0], wdN = [0, 0, 0, 0, 0, 0, 0]; rng(90, 0).forEach(x => { const k = (new Date(x.d + 'T12:00:00').getDay() + 6) % 7; wd[k] += x.t; wdN[k]++; });
  const wdA = wd.map((v, i) => wdN[i] ? v / wdN[i] : 0), wmx = Math.max(...wdA, 0.0001), JOURS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
  const pagesCard = vues ? `<div class="db-2"><div class="st-card"><h2>Pages les plus vues</h2><p>Sur ${n} jours.</p>${top.length ? top.map(([k, v]) => `<div class="st-pg"><span>${esc(PAGES[k] || k)}</span><div class="t"><i style="width:${v / top[0][1] * 100}%"></i></div><b>${v} <small>(${Math.round(v / total * 100)} %)</small></b></div>`).join('') : '<p class="ex-empty">Aucune visite.</p>'}</div>
    <div class="st-card"><h2>Jours les plus fréquentés</h2><p>Moyenne de pages vues par jour de la semaine, sur 90 jours.</p>${JOURS.map((j, i) => `<div class="st-pg"><span>${j}</span><div class="t"><i style="width:${wdA[i] / wmx * 100}%"></i></div><b>${wdA[i].toFixed(1).replace('.', ',')}</b></div>`).join('')}</div></div>` : '';

  /* Abonnés notifications */
  let pushCard = '';
  if (push) {
    const start = now - (n - 1) * DAY, before = push.filter(x => x.creeLe < start).length;
    const pts = Array.from({ length: n }, (_, i) => before + push.filter(x => x.creeLe >= start && x.creeLe < start + (i + 1) * DAY).length);
    const pm = Math.max(...pts, 1), W = 600, Hh = 140, X = i => n > 1 ? i / (n - 1) * W : W, Y = v => Hh - 6 - v / pm * (Hh - 16);
    const line = pts.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const dev = { 'iPhone / iPad': 0, 'Android': 0, 'Ordinateur': 0, 'Autre': 0 };
    push.forEach(x => { const u = String(x.ua || ''); dev[/iPhone|iPad|iPod/i.test(u) ? 'iPhone / iPad' : /Android/i.test(u) ? 'Android' : /Windows|Macintosh|Linux|CrOS/i.test(u) ? 'Ordinateur' : 'Autre']++; });
    pushCard = `<div class="db-2"><div class="st-card"><h2>Abonnés aux notifications</h2><p>Appareils abonnés sur ${n} jours : <b>${pushN}</b> au total.</p>
      <svg class="db-line" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="Évolution du nombre d'appareils abonnés, de ${pts[0]} à ${pts[n - 1]}"><polygon points="0,${Hh} ${line} ${W},${Hh}" fill="rgba(201,168,76,.22)"/><polyline points="${line}" fill="none" stroke="var(--bleu)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>
      <p class="db-note">Compte les appareils encore abonnés : un désabonnement fait baisser la courbe.${pushN === 0 ? ' Compteur à 0 alors que des appareils ont activé les notifications ? Vérifie que les règles Firestore autorisent l\'écriture dans « push_tokens ».' : ''}</p></div>
      <div class="st-card"><h2>Type d'appareil</h2><p>Sur iPhone, les notifications ne marchent que si le site est installé sur l'écran d'accueil.</p>${pushN ? Object.entries(dev).filter(([, v]) => v).map(([k, v]) => `<div class="st-pg"><span>${k}</span><div class="t"><i style="width:${v / pushN * 100}%"></i></div><b>${v} <small>(${Math.round(v / pushN * 100)} %)</small></b></div>`).join('') : '<p class="ex-empty">Aucun appareil abonné.</p>'}</div></div>`;
  }

  /* Qualité des contenus */
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0, bar = (l, a, b) => `<div class="st-pg ok"><span>${l}</span><div class="t"><i style="width:${pct(a, b)}%"></i></div><b>${pct(a, b)} % <small>(${a}/${b})</small></b></div>`;
  const upc = (events || []).filter(e => e.date >= today);
  const qual = (clubs || events) ? `<div class="st-card"><h2>Qualité des informations</h2><p>Part des fiches complètes.</p>${clubs ? bar('Clubs avec un contact', clubs.filter(c => c.tel || c.email).length, clubs.length) + bar('Coordonnées du dirigeant publiables', clubs.filter(c => (c.adresse || c.tel || c.email) && c.consentement).length, clubs.filter(c => c.adresse || c.tel || c.email).length) : ''}${events ? bar('Compétitions à venir complètes', upc.filter(e => e.lieu && e.heure).length, upc.length) + bar('Compétitions à venir avec lien', upc.filter(e => e.lien || e.lien2).length, upc.length) : ''}</div>` : '';

  /* Activité des administrateurs */
  let actCard = '';
  if (journal) {
    const who = {}, obj = {}; journal.forEach(x => { if (x.date > now - 30 * DAY) who[x.qui || 'Inconnu'] = (who[x.qui || 'Inconnu'] || 0) + 1; const o = x.objet || 'Autre'; if (!obj[o] || x.date > obj[o]) obj[o] = x.date; });
    const wl = Object.entries(who).sort((a, b) => b[1] - a[1]).slice(0, 6), ol = Object.entries(obj).sort((a, b) => a[1] - b[1]).slice(0, 8);
    actCard = `<div class="db-2"><div class="st-card"><h2>Qui modifie le site ?</h2><p>Actions des 30 derniers jours.</p>${wl.length ? wl.map(([k, v]) => `<div class="st-pg"><span>${esc(k)}</span><div class="t"><i style="width:${v / wl[0][1] * 100}%"></i></div><b>${v}</b></div>`).join('') : '<p class="ex-empty">Aucune action ce mois-ci.</p>'}</div>
      <div class="st-card"><h2>Rubriques à rafraîchir</h2><p>Dernière modification, des plus anciennes aux plus récentes.</p>${ol.length ? ol.map(([k, t]) => `<div class="st-pg"><span>${esc(k)}</span><div class="t"></div><b style="${now - t > 90 * DAY ? 'color:var(--ko)' : ''}">${ago(t)}</b></div>`).join('') : '<p class="ex-empty">Journal vide.</p>'}<p class="db-note">Calculé sur les 500 dernières actions du journal.</p></div></div>`;
  }

  /* Prochaines compétitions */
  const S = SCHEMA.events, nx5 = upc.sort(S.sort).slice(0, 5);
  const nextH = nx5.length ? `<div class="sech"><h2>Prochaines compétitions</h2><button class="lnkb" data-go="events">Voir le calendrier</button></div>${nx5.map(e => `<div class="row">${S.left(e)}<div class="m"><strong>${esc(e.titre)}</strong><small>${S.sub(e)}</small></div></div>`).join('')}` : '';

  $('#main').innerHTML = head('Tableau de bord', 'Ce qui demande ton attention, la fréquentation du site et l\'activité du comité.') +
    `<div class="sech"><h2>À traiter</h2></div>${todoH}${tiles}` +
    `<div class="st-top" role="group" aria-label="Période">${[7, 30, 90].map(d => `<button data-d="${d}" class="${d === n ? 'on' : ''}">${d} derniers jours</button>`).join('')}</div>` +
    chart + pagesCard + pushCard + `<div class="db-2">${qual}</div>` + actCard + nextH + `<div class="st-help"><b>À savoir :</b> une « vue » correspond à une page ouverte par un visiteur, comptée une seule fois par visite. Aucun cookie ni donnée personnelle n'est utilisé, donc les chiffres sont des ordres de grandeur.</div>`;

  const ch = $('#main').querySelector?.('.st-chart');
  if (ch) {
    let tip = document.getElementById('dbtip');
    if (!tip) { tip = document.createElement('div'); tip.id = 'dbtip'; tip.className = 'db-tip'; tip.hidden = true; tip.setAttribute('role', 'status'); document.body.append(tip); }
    const hide = () => { tip.hidden = true; ch.querySelectorAll('.st-col.hv').forEach(c => c.classList.remove('hv')); };
    const show = e => { const c = e.target.closest('.st-col'); if (!c) return hide(); ch.querySelectorAll('.st-col.hv').forEach(o => o !== c && o.classList.remove('hv')); c.classList.add('hv'); tip.textContent = c.dataset.tip; tip.hidden = false;
      const r = c.getBoundingClientRect(), w = tip.offsetWidth, x = Math.max(6, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 6)); tip.style.left = x + 'px'; tip.style.top = Math.max(6, r.top - tip.offsetHeight - 8) + 'px'; };

}

/* Import du contenu actuel
   Les imports « Le Comité » et « Les Clubs » sont retirés : les pages comite.html et clubs.html
   ne contiennent plus de coordonnées, les lire effacerait les données de la base. */
function viewImport() {
  $('#main').innerHTML = head('Import', 'À faire une seule fois au départ : copie dans Firebase ce qui est écrit aujourd\'hui dans tes pages. Attention : les données déjà présentes dans la section choisie sont remplacées.') +
  `<div class="card"><div class="flex">${[['settings', 'Infos du site'], ['events', 'Le Calendrier'], ['annuaire', 'L\'Annuaire']].map(([k, l]) => `<button class="btn b-bl" data-i="${k}">${ic('dl', 16)}Importer : ${l}</button>`).join('')}</div><p id="imsg" role="status" style="font-weight:700;margin:1rem 0 0"></p></div>`;
  $('#main').onclick = async e => { const b = e.target.closest('[data-i]'); if (!b) return; const k = b.dataset.i;
    if (!await ask('Importer cette section ?', 'Les données existantes de cette section seront remplacées.', 'Importer')) return;
    try { $('#imsg').textContent = 'Import en cours…'; const n = await IMPORT[k](); await logAct('import', 'Import', ({ settings: 'Infos du site', events: 'Le Calendrier', annuaire: 'L\'Annuaire' })[k] || k, `${n} élément${n > 1 ? 's' : ''} importé${n > 1 ? 's' : ''} (données précédentes remplacées)`); $('#imsg').textContent = `Terminé (${n} élément${n > 1 ? 's' : ''}).`; } catch (er) { $('#imsg').textContent = 'Erreur : ' + er.message; } };
}
const page = async u => new DOMParser().parseFromString(await (await fetch(u + '?' + Date.now())).text(), 'text/html');
async function replaceAll(col, items, only) {
  const old = (await getDocs(collection(db, col))).docs.filter(d => !only || only(d.data()));
  for (let i = 0; i < old.length; i += 400) { const b = writeBatch(db); old.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
  for (let i = 0; i < items.length; i += 400) { const b = writeBatch(db); items.slice(i, i + 400).forEach(it => b.set(doc(collection(db, col)), it)); await b.commit(); }
  return items.length;
}
const IMPORT = {
  async settings() {
    const d = await page('index.html'), t = s => d.querySelector(s)?.textContent.trim() || '', s = { heroDesc: t('.hero-desc') };
    [...d.querySelectorAll('.stat-item')].forEach((el, i) => { s[`stat${i + 1}v`] = el.querySelector('strong').textContent; s[`stat${i + 1}l`] = el.querySelector('span').textContent; });
    const c = [...d.querySelectorAll('.contact-detail-text')];
    s.adresse = c[0].querySelector('span').innerHTML.replace(/<br\s*\/?>/g, '\n').replace(/<[^>]+>/g, '').trim();
    s.tel = c[1].querySelector('a').textContent; s.email = c[2].querySelector('a').textContent; s.emailDev = c[3].querySelector('a').textContent;
    const pdf = (await page('calendrier.html')).querySelector('.dl-btn'); if (pdf) { s.pdfUrl = pdf.getAttribute('href'); s.pdfLabel = pdf.textContent.replace('⬇', '').trim(); }
    await setDoc(doc(db, 'settings', 'general'), s); return 1;
  },
  async events() {
    const txt = await (await fetch('calendrier.html?' + Date.now())).text(), m = txt.match(/const EVENTS = (\[[\s\S]*?\n\s*\]);/);
    if (!m) throw new Error('Calendrier introuvable dans calendrier.html');
    return replaceAll('events', new Function('return ' + m[1])().map(e => ({ date: e.date, titre: e.titre, type: e.type, lieu: e.lieu || '', heure: e.heure || '', formation: e.formation || '', obs: e.obs || '', lien: '', lienTexte: '', lien2: '', lien2Texte: '' })));
  },
  async annuaire() {
    return replaceAll('annuaire', [
      ['60', 'Comité de l\'Oise', 'https://ffpjp-comite-oise-petanque.e-monsite.com'],
      ['59', 'Comité du Nord', 'https://ffpjp-nord.org/'],
      ['62', 'Comité du Pas-de-Calais', 'https://www.ffpjp62.fr/'],
      ['02', 'Comité de l\'Aisne', 'https://www.ffpjp-comite-aisne-petanque.com/']
    ].map(([num, nom, url], i) => ({ num, nom, desc: 'Site du ' + nom.toLowerCase(), url, ordre: i + 1 })));
  }
};
