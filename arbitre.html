<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a2342">
<title>Désignation d’arbitre — Comité de la Somme</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a2342;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:1.2rem}
  main{background:#fff;color:#14213d;border-radius:16px;padding:1.6rem;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  h1{font-size:1.3rem;margin:0 0 .3rem}
  .sub{color:#5b6475;margin:0 0 1rem}
  dl{margin:0 0 1.2rem;display:grid;grid-template-columns:auto 1fr;gap:.35rem .8rem}
  dt{color:#5b6475}dd{margin:0;font-weight:600}
  .btns{display:flex;gap:.6rem;flex-wrap:wrap}
  button{flex:1;min-height:48px;border:0;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
  .ok{background:#067647;color:#fff}.ko{background:#fff;color:#b42318;border:2px solid #b42318}
  button[disabled]{opacity:.5;cursor:default}
  #msg{margin-top:1rem;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Désignation d’arbitre</h1>
  <p class="sub" id="who"></p>
  <dl id="info"></dl>
  <div class="btns" id="btns"><button class="ok" data-s="accepte">J’accepte</button><button class="ko" data-s="refuse">Je refuse</button></div>
  <p id="msg" role="status"></p>
</main>
<script type="module">
import { db } from './firebase-config.js';
import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const q = new URLSearchParams(location.hash.slice(1)), $ = s => document.querySelector(s);
const e = q.get('e'), a = q.get('a'), t = q.get('t');
const long = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '';
if (!e || !a || !t || t.length < 20) { $('#who').textContent = 'Ce lien n’est pas valide. Demande un nouveau lien au comité.'; $('#btns').hidden = true; }
else {
  $('#who').textContent = q.get('n') ? 'Bonjour ' + q.get('n') + ', merci de confirmer votre présence.' : 'Merci de confirmer votre présence.';
  const rows = [['Compétition', q.get('ti')], ['Date', long(q.get('d'))], ['Lieu', q.get('l')], ['Heure', q.get('h')], ['Rôle', q.get('r')]].filter(r => r[1]);
  $('#info').innerHTML = rows.map(r => '<dt></dt><dd></dd>').join('');
  [...document.querySelectorAll('#info dt')].forEach((n, i) => n.textContent = rows[i][0]);
  [...document.querySelectorAll('#info dd')].forEach((n, i) => n.textContent = rows[i][1]);
  $('#btns').onclick = async ev => { const b = ev.target.closest('button'); if (!b) return;
    document.querySelectorAll('#btns button').forEach(x => x.disabled = true);
    try {
      await addDoc(collection(db, 'reponses'), { eid: e, aid: a, tok: t, statut: b.dataset.s, at: Date.now() });
      $('#msg').textContent = b.dataset.s === 'accepte' ? 'Merci, votre acceptation est enregistrée.' : 'Merci, votre refus est enregistré. Le comité va vous remplacer.';
    } catch (er) { $('#msg').textContent = 'Envoi impossible, réessayez ou contactez le comité.'; document.querySelectorAll('#btns button').forEach(x => x.disabled = false); }
  };
}
</script>
</body>
</html>
