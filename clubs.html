<script>

  window.addEventListener('scroll', () => {
    document.getElementById('navbar').style.boxShadow = window.scrollY > 30 ? '0 4px 30px rgba(0,0,0,0.4)' : 'none';
  });

  const reveals = document.querySelectorAll('.reveal');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => {
      if (e.isIntersecting) { setTimeout(() => e.target.classList.add('visible'), i * 80); obs.unobserve(e.target); }
    });
  }, { threshold: 0.08 });
  reveals.forEach(r => obs.observe(r));

  let activeSecteur = 'all';

  function filterSecteur(btn, secteur) {
    activeSecteur = secteur;
    document.querySelectorAll('.secteur-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterClubs();
  }

  function filterClubs() {
    const q = document.getElementById('clubs-search').value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    let visible = 0;
    document.querySelectorAll('.club-card').forEach(card => {
      const s = card.getAttribute('data-secteur');
      const search = card.getAttribute('data-search') || '';
      const secteurOk = activeSecteur === 'all' || s === activeSecteur;
      const searchOk = !q || search.includes(q);
      const show = secteurOk && searchOk;
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    document.getElementById('clubs-count').textContent = visible + ' club' + (visible > 1 ? 's' : '') + ' affiché' + (visible > 1 ? 's' : '');
    ['centre','maritime','santerre'].forEach(sec => {
      const bloc = document.getElementById('bloc-' + sec);
      if (!bloc) return;
      const hasVisible = [...bloc.querySelectorAll('.club-card')].some(c => c.style.display !== 'none');
      bloc.style.display = hasVisible ? '' : 'none';
    });
  }
</script>
<script type="module">
import { db } from './firebase-config.js';
import { collection, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* RGPD : true = adresse, téléphone et email du responsable ne s'affichent que si une « date d'accord » est saisie dans l'admin */
const EXIGER_ACCORD = true;

/*PURE*/
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const digits = s => String(s || '').replace(/[^\d+]/g, '');
const SECT = [['centre', '🏙️ Secteur Centre'], ['maritime', '⚓ Secteur Maritime'], ['santerre', '🌾 Secteur Santerre']];
/* Itinéraire : destination la plus précise possible, sans jamais utiliser l'adresse du responsable (donnée personnelle).
   1) « Position exacte du terrain » saisie dans l'admin (coordonnées GPS ou adresse), utilisée telle quelle ;
   2) sinon le champ « Terrain », nettoyé (on retire « près du… », les parenthèses, les noms de lieu qui précèdent une rue…)
      et complété par le nom officiel et le CODE POSTAL de la commune, ce qui évite de tomber dans une autre commune ;
   3) sinon la ville seule. */
const COMMUNES = {
  'amiens': ['Amiens', '80000'], 'bourdon': ['Bourdon', '80310'], 'boves': ['Boves', '80440'], 'cagny': ['Cagny', '80330'],
  'corbie': ['Corbie', '80800'], 'dreuil': ['Dreuil-lès-Amiens', '80470'], 'fienvillers-doullens': ['Fienvillers', '80750'],
  'flixecourt': ['Flixecourt', '80420'], 'longueau': ['Longueau', '80330'], 'pernois': ['Pernois', '80670'],
  'poix': ['Poix-de-Picardie', '80290'], 'saint-ouen': ['Saint-Ouen', '80610'], 'villers-bretonneux': ['Villers-Bretonneux', '80800'],
  'abbeville': ['Abbeville', '80100'], 'ault': ['Ault', '80460'], 'bethencourt-sur-mer': ['Béthencourt-sur-Mer', '80130'],
  'bouvaincourt-sur-bresle': ['Bouvaincourt-sur-Bresle', '80220'], 'chepy': ['Chépy', '80210'], 'dargnies': ['Dargnies', '80570'],
  'feuquieres': ['Feuquières-en-Vimeu', '80210'], 'fressenneville': ['Fressenneville', '80390'], 'friville': ['Friville-Escarbotin', '80130'],
  'gamaches': ['Gamaches', '80220'], 'longpre-les-corps-saints': ['Longpré-les-Corps-Saints', '80510'], 'mers-les-bains': ['Mers-les-Bains', '80350'],
  'oisemont': ['Oisemont', '80140'],
  'albert': ['Albert', '80300'], 'ham': ['Ham', '80400'], 'montdidier': ['Montdidier', '80500'], 'nesle': ['Nesle', '80190'],
  'peronne': ['Péronne', '80200'], 'roye': ['Roye', '80700']
};
function terrainPropre(t) {
  let x = String(t || '').replace(/\([^)]*\)/g, ' ').split(/\s+\/\s+/)[0].replace(/\s{2,}/g, ' ').replace(/^[\s,;-]+|[\s,;-]+$/g, '');
  x = x.replace(/^(près|pres|proche|à côté|a côté|a cote)\s+(du|de la|de l['’]|des|d['’])\s*/i, '');
  /* « Ancienne école, Rue des Lattes » ou « Complexe sportif Rue Philippe Ermenault » : la rue est ce que les cartes savent trouver */
  const m = /(?:^|[\s,])((?:\d+\s*(?:bis|ter)?\s+)?(?:rue|route|chemin|place|impasse|boulevard|avenue|ruelle|allée|allee|square|quai|cours)\b.*)$/i.exec(x);
  const r = (m ? m[1] : x).trim();
  return r.charAt(0).toUpperCase() + r.slice(1);
}
/* Coordonnées GPS saisies dans l'admin (ex : 49.8941, 2.2958) : la façon la plus exacte de désigner le terrain */
function coordonnees(v) {
  const brut = String(v || '').trim();
  /* Format copié depuis Google Maps : 50°03'47.4"N 1°38'35.2"E (degrés, minutes, secondes) */
  const dms = /^\s*(\d{1,3})\s*[°º]\s*(?:(\d{1,2})\s*['’′]\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*(?:["”″]|''|’’)?\s*)?)?([NSns])\s*[,;]?\s*(\d{1,3})\s*[°º]\s*(?:(\d{1,2})\s*['’′]\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*(?:["”″]|''|’’)?\s*)?)?([EWOewo])\s*$/.exec(brut);
  if (dms) {
    const n = s => parseFloat(String(s || '0').replace(',', '.'));
    let lat = n(dms[1]) + n(dms[2]) / 60 + n(dms[3]) / 3600, lng = n(dms[5]) + n(dms[6]) / 60 + n(dms[7]) / 3600;
    if (/s/i.test(dms[4])) lat = -lat; if (/[wo]/i.test(dms[8])) lng = -lng;
    return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? lat.toFixed(6) + ',' + lng.toFixed(6) : null;
  }
  let x = brut; if (x.includes(';')) x = x.replace(/,/g, '.');   /* « 49,8941 ; 2,2958 » (virgule décimale française) */
  const m = /^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,;]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/.exec(x);
  if (!m) return null;
  const lat = +m[1], lng = +m[2];
  return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? lat + ',' + lng : null;
}
/* Retrouve la commune même si la ville est saisie « ST OUEN », « Saint Ouen », « FRIVILLE » ou « Friville-Escarbotin » */
function communeConnue(ville) {
  const cle = s => fold(s).replace(/[’'`_.]/g, '-').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').replace(/^st-/, 'saint-').replace(/^ste-/, 'sainte-');
  const k = cle(ville); if (!k) return null;
  if (COMMUNES[k]) return COMMUNES[k];
  const hit = Object.keys(COMMUNES).find(x => k.startsWith(x + '-') || x.startsWith(k + '-') || cle(COMMUNES[x][0]) === k);
  return hit ? COMMUNES[hit] : null;
}
function destination(c, precis0, terrain0) {
  const t = v => String(v || '').trim();
  const precis = t(precis0 !== undefined ? precis0 : c.itineraire), ville = t(c.ville), terrain = t(terrain0 !== undefined ? terrain0 : c.terrain);
  const gps = coordonnees(precis);
  if (gps) return gps;
  const fr = x => /france\s*$/i.test(x) ? x : x + ', France';
  const connue = communeConnue(ville);
  /* Adresse saisie à la main : on y ajoute commune + code postal si elle n'en contient pas (sinon les cartes tombent dans une autre commune) */
  if (precis) return fr(/\b\d{5}\b/.test(precis) || !connue ? precis : precis + ', ' + connue[1] + ' ' + connue[0]);
  if (!ville && !terrain) return '';
  if (terrain && /\b\d{5}\b/.test(terrain)) return fr(terrain);
  const tp = terrainPropre(terrain);
  if (connue) {
    const [nom, cp] = connue;
    return [tp, tp && fold(tp).includes(fold(nom)) ? cp : cp + ' ' + nom, 'France'].filter(Boolean).join(', ');
  }
  return [tp, ville, 'Somme', 'France'].filter(Boolean).join(', ');
}
/* Une seule adresse de départ « intelligente » selon l'appareil :
   iPhone / iPad → Plans (app par défaut) · Android → lien geo: (l'app de cartes choisie par le téléphone) · ordinateur → Google Maps dans un nouvel onglet */
const NAV = typeof navigator !== 'undefined' ? navigator : {};
const UA = NAV.userAgent || '';
const IOS = /iPad|iPhone|iPod/.test(UA) || (NAV.platform === 'MacIntel' && NAV.maxTouchPoints > 1);
const ANDROID = /Android/i.test(UA);
const ICONE_ITIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>';
/* Un club peut avoir plusieurs terrains. Dans l'admin : une ligne par terrain, « Nom | coordonnées ».
   Sans position saisie, un champ « Terrain » du type « Stade A / Stade B » donne aussi un bouton par terrain. */
function terrains(c) {
  const lignes = String(c.itineraire || '').split(/\n+/).map(l => l.trim()).filter(Boolean);
  if (lignes.length) return lignes.map(l => {
    const m = /^([^|]+?)\s*\|\s*(.+)$/.exec(l) || /^([^\d°][^:=]*?)\s*[:=]\s*(.+)$/.exec(l);
    return m ? { nom: m[1].trim(), precis: m[2].trim() } : { nom: '', precis: l };
  });
  const parts = String(c.terrain || '').split(/\s+\/\s+|\n+|\s*;\s*/).map(x => x.trim()).filter(Boolean);
  return parts.length > 1 ? parts.map(p => ({ nom: p.replace(/\([^)]*\)/g, '').trim(), terrain: p })) : [{ nom: '' }];
}
function lienItin(c, tr, multi, i) {
  const d = destination(c, tr.precis, tr.terrain);
  if (!d) return '';
  const q = encodeURIComponent(d), gps = !!coordonnees(tr.precis);
  const href = IOS ? `https://maps.apple.com/?daddr=${q}&dirflg=d`
    : ANDROID ? (gps ? `geo:${d}?q=${d}(${encodeURIComponent(tr.nom || c.assoc || c.ville || 'Terrain')})` : `geo:0,0?q=${q}`)
    : `https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=driving`;
  const ext = IOS || ANDROID ? '' : ' target="_blank" rel="noopener"';
  const nom = esc(c.ville || c.assoc || 'ce club');
  const lib = multi ? 'Itinéraire — ' + esc(tr.nom || 'Terrain ' + (i + 1)) : 'Itinéraire';
  return `<a class="btn-itin" href="${href}"${ext} aria-label="${lib.replace(/<[^>]*>/g, '')} (${nom})">${ICONE_ITIN}${lib}</a>`;
}
function itineraire(c) {
  const tr = terrains(c), multi = tr.length > 1;
  const l = tr.map((x, i) => lienItin(c, x, multi, i)).filter(Boolean);
  return l.length ? `<div class="club-itin">${l.join('')}</div>` : '';
}
const row = (i, l, v) => `<div class="club-info-row"><span class="club-info-icon">${i}</span><div><span class="club-info-label">${l}</span>${v}</div></div>`;

function carte(c) {
  const ok = !EXIGER_ACCORD || !!c.consentement, r = [];
  if (c.president) r.push(row('👤', esc(c.prLabel || 'Président'), esc(c.president)));
  if (ok && c.adresse) r.push(row('📍', 'Adresse', esc(c.adresse)));
  if (ok && c.tel) r.push(row('📞', 'Téléphone', `<a href="tel:${esc(digits(c.tel))}" style="color:inherit">${esc(c.tel)}</a>`));
  if (ok && c.email) r.push(row('✉️', 'Email', `<span class="club-email"><a href="mailto:${esc(c.email)}" style="color:inherit">${esc(c.email)}</a></span>`));
  if (c.terrain) r.push(row('🎯', 'Terrain', esc(c.terrain)));

  return `<div class="club-card" data-secteur="${esc(c.secteur)}" data-search="${esc(search)}"><div class="club-card-header"><span class="club-num">${esc(c.num)}</span><div><h3>${esc(c.ville)}<span class="club-nom-assoc">${esc(c.assoc)}</span></h3></div></div><div class="club-card-body">${r.join('')}${itineraire(c)}</div></div>`;
}
function blocs(list) {

}
